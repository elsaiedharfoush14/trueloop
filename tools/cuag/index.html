<style>
/* Layout: TrueLoop tool. Slim sticky toolbar -> brand header -> step progress chips -> numbered step cards -> share card -> TrueLoop strip. */
:root{
  --bg:#eef3f6; --card:#ffffff; --ink:#071b2b; --muted:#566a77; --line:#d3dde3; --soft:#f5f9fb;

  --good:#1a8f5c; --good-bg:#dff3ea; --warn:#a15c00; --warn-bg:#fdf0d9; --crit:#b42318; --crit-bg:#fde4e1;
  --f-display:"Readex Pro",system-ui,sans-serif; --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif; --f-mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#06131d;--card:#0c2333;--ink:#e3eef4;--muted:#9bb2c0;--line:#1e3d50;--soft:#0a1c29;--water:#5aa2f0;--aqua:#3fd0f0;--good:#4fd39b;--good-bg:#0f3327;--warn:#ffb84d;--warn-bg:#3a2a10;--crit:#ff8a7a;--crit-bg:#3d1714;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-bottom:env(safe-area-inset-bottom,0px)}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] select,[dir=rtl] button{font-family:var(--f-ar)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#071b2b}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:#071b2b;color:#fff}
.bar-in{max-width:960px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .mk{width:26px;height:27px;flex:none}
.bar .nm{font-family:var(--f-display);font-weight:600;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .nm .lt{font-weight:300}
.seg{display:inline-flex;border:1px solid #29506a;border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:#b9d3e2;padding:5px 10px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--aqua);color:#04202c}
.bar button.tb{background:transparent;border:1px solid #29506a;color:#fff;padding:5px 10px;font-size:.8rem}
.bar button.tb.pri{background:var(--water);border-color:var(--water)}
.toast{font-size:.82rem;color:#7fe3f5}
.wrap{max-width:960px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
a.back{font-weight:600;font-size:.88rem;color:var(--water);text-decoration:none;width:fit-content}
header.top{display:flex;gap:16px;align-items:center}
header.top svg{width:60px;height:62px;flex:none}
header.top .t{display:grid;gap:3px;min-width:0}
.brand{font-family:var(--f-display);font-size:.95rem;color:var(--muted)} .brand b{color:var(--ink)} .brand .lt{font-weight:300}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(1.35rem,3.6vw,1.9rem)}
h2{font-size:1.05rem;display:flex;gap:10px;align-items:center}
p{margin:0;max-width:72ch} .muted{color:var(--muted);font-size:.9rem}
.prog{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.prog a{display:grid;gap:2px;justify-items:center;text-decoration:none;color:var(--muted);font-size:.74rem;text-align:center;padding:8px 4px;border-radius:8px;background:var(--card);border:1px solid var(--line);min-width:0}
.prog a i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.prog a.ok i{background:var(--good);border-color:var(--good);color:#fff}
.prog a.warn i{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.prog a.bad i{background:var(--crit);border-color:var(--crit);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0;scroll-margin-top:70px}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--water),var(--aqua));color:#fff;font-family:var(--f-mono);font-size:.85rem;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
label{display:grid;gap:4px;font-size:.84rem;color:var(--muted);min-width:0;align-content:start}
input,select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono);direction:ltr}
[dir=rtl] input[type=number]{text-align:right}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--water);outline-offset:2px}
button{font:inherit;font-size:.86rem;border-radius:7px;padding:7px 14px;cursor:pointer;border:1px solid var(--water);background:transparent;color:var(--water);font-weight:600}
button.pri{background:var(--water);color:#fff}
code{font-family:var(--f-mono);font-size:.84em;direction:ltr;unicode-bidi:isolate;background:var(--soft);border:1px solid var(--line);padding:0 6px;border-radius:4px;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:600;font-size:.76rem;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
td.v{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-weight:500}
td.tx{font-weight:500;min-width:9em}
tr.key td{background:color-mix(in srgb,var(--aqua) 11%,transparent)}
tr.key td.v:first-child{box-shadow:inset 3px 0 0 var(--aqua)}
[dir=rtl] tr.key td.v:first-child{box-shadow:inset -3px 0 0 var(--aqua)}
.msgs{display:grid;gap:6px}
.msg{border-radius:9px;padding:10px 12px;background:var(--soft);border:1px solid var(--line)}
.msg.ok{background:var(--good-bg);border-color:transparent;color:var(--ink)}
.msg.warn{background:var(--warn-bg);border-color:transparent}
.msg.bad{background:var(--crit-bg);border-color:transparent}
.msg::before{font-weight:700;margin-inline-end:6px}
.msg.ok::before{content:"✓";color:var(--good)} .msg.warn::before{content:"!";color:var(--warn)} .msg.bad::before{content:"✕";color:var(--crit)}
.kv{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.9rem}
.kv span{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.kv b{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-weight:500}
ul{margin:0;padding-inline-start:1.3em;display:grid;gap:6px}
textarea{font-family:var(--f-mono);font-size:.8rem;width:100%;min-height:220px;direction:ltr;text-align:left;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.share{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.share .qrb{width:148px;height:148px;background:#fff;border-radius:12px;padding:8px;position:relative;border:1px solid var(--line)}
.share .qrb img{width:100%;height:100%;display:block;image-rendering:pixelated}
.share .qrb .ql{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);background:#fff;border-radius:7px;display:grid;place-items:center}
.share .qrb .ql svg{width:28px;height:29px}
.linkline{font-family:var(--f-mono);font-size:.78rem;direction:ltr;unicode-bidi:isolate;word-break:break-all;color:var(--muted)}
.cta{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:#071b2b;color:#fff;border-radius:12px;padding:18px}
.cta svg.mk{width:52px;height:54px} .cta p{font-size:.92rem;opacity:.9} .cta a{color:#7fe3f5;font-weight:600}
.foot{color:var(--muted);font-size:.78rem;text-align:center}
.rep{display:none}
@media (max-width:620px){.prog{grid-template-columns:repeat(3,minmax(0,1fr))}.share,.cta{grid-template-columns:1fr}.share .qrb{margin-inline:auto}header.top svg{width:48px;height:50px}}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .bar,.prog,.no-print,a.back,.cta,#s8,#share,body::before{display:none!important}
  .card{border:1px solid #bbb;break-inside:avoid;padding:10px}
  .rep{display:block;font-size:.8rem;color:#444}
  input,select{border:0;background:transparent;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>

  var SOUND={hdpe:2400,ppr:2600};
  function nearest(list,v){var b=list[0];list.forEach(function(x){if(Math.abs(x-v)<Math.abs(b-v))b=x;});return b;}
  function r1(x){return Math.round(x*10)/10;}

  function sizeFromCirc(mat,circCm,opt){
    if(!(circCm>0))return null;
    var od=circCm*10/Math.PI,res;

    else if(mat==='pvc')res={od:nearest(PVC_OD,od),wall:null,label:'PVC'};
    else if(mat==='cu')res={od:nearest(CU_OD,od),wall:null,label:'Copper'};
    else res={od:r1(od),wall:null,label:''};
    res.measured=r1(od);res.diffPct=Math.abs(res.od-od)/res.od*100;return res;
  }
  function freqScale(peak){
    var need=Math.max(peak||0,1)*1.2,opts=[10,20,50];
    for(var i=0;i<opts.length;i++)if(opts[i]*60>=need)return {fmax:opts[i],m69:opts[i]*60,k:1};
    var m69=Math.ceil(need/500)*500;return {fmax:50,m69:m69,k:m69/3000};
  }
  function flowmeter(s,t){
    var id=s.od-2*s.wall,perMs=Math.PI*Math.pow(id/1000,2)/4*60000,fs=freqScale(s.peak);
    var plastic=s.mat==='hdpe'||s.mat==='ppr'||s.mat==='pvc',z=s.od>300||(plastic&&s.wall>20);
    var tr=id<50?['TS-2',t('tr_s')]:id<=100?[t('trAlt'),t('tr_m')]:id<=700?['TM-1',t('tr_t')]:['TL-1',t('tr_l')];
    var rows=[['M11',r1(s.od),t('r_m11')],['M12',s.wall,t('r_m12',{id:r1(id)})],['M14',M14[s.mat],SOUND[s.mat]?t('r_m14o'):t('r_m14s')]];
    if(SOUND[s.mat])rows.push(['M15',SOUND[s.mat],t('r_m15')]);
    rows=rows.concat([['M16','0. None',t('r_m16')],['M20','0. Water',t('r_m20')],['M23',tr[0],tr[1]],
      ['M24',z?t('m24z_v'):'V',z?t('m24z'):t('m24v')],['M25',t('m25_v'),t('m25')],
      ['M30','Metric',''],['M31','L/min',t('m31')],['M32','Liter',''],['M33','3. x1',t('m33')],
      ['M34 / M35 / M36','On / On / Off',t('m34')],['M40','5',t('m40')],['M41','0.03',t('m41')],
      ['M78','24. Flow Rate Pulse',t('m78'),1],['M67','0 – '+fs.fmax+' Hz',t('m67'),1],['M68','0',t('m68'),1],
      ['M69',fs.m69,t('m69',{f:fs.fmax,m:fs.m69,k:fs.k}),1],
      ['M79',t('m79_v'),t('m79')],['M73 / M74','-99999 / 20',t('m73')],['M42','Set Zero',t('m42')],['M26','ENT',t('m26')]]);
    return {id:id,perMs:perMs,fs:fs,rows:rows};
  }
  function controller(peak,fs,t){
    var peakT=peak>0?Math.round(peak/fs.k):null,start=peakT?Math.round(peakT*1.5):null;
    return {start:start,rows:[['Minimum Current','0.0 A',t('ct_min')],
      ['TFR at Max Flow',start||t('ct_tfr_v'),t('ct_tfr',{p:peakT||'—'}),1],
      [t('ct_exp'),t('ct_exp_v',{k:fs.k}),t('ct_exp_w')]]};
  }
  function signal(up,dn,q,m91,t){
    var out=[];
    if(up>0||dn>0){var lo=Math.min(up||0,dn||0);out.push(lo>=60?['ok',t('sigOk',{v:lo})]:['bad',t('sigBad',{v:lo})]);}
    if(q>0)out.push(q>=80?['ok',t('qOk',{v:q})]:['warn',t('qWarn')]);
    if(m91>0){if(m91>=97&&m91<=103)out.push(['ok',t('m91Ok',{v:m91})]);
      else if(m91>=95&&m91<=105)out.push(['warn',t('m91Warn',{v:m91})]);
      else out.push(['bad',t(m91<97?'m91Low':'m91High',{v:m91})]);}
    return out;
  }
  function tfrCheck(flow,tfr,k,t){
    if(!(flow>0)||tfr===null||!(tfr>=0))return null;
    if(tfr===0)return ['bad',t('tfrZero')];
    var e=flow/k,r=tfr/e,stuck=[150,300,600].some(function(x){return Math.abs(tfr-x)<=x*0.02;});
    if(Math.abs(r-1)<=0.25)return ['ok',t('tfrOk',{e:Math.round(e)})];
    if(stuck)return ['bad',t('tfrStuck',{t:tfr})];
    return ['warn',t('tfrOff',{e:Math.round(e),t:tfr})];
  }
  function copper(bg,c1,c2,target,set,t){
    var vals=[c1,c2].filter(function(x){return x>0;});
    if(!vals.length||!(target>0))return null;
    var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length,added=avg-(bg||0);
    if(added<=0)return {cls:'bad',text:t('cuNone')};
    var ratio=added/target,res={avg:avg,added:added},a=added.toFixed(2);
    if(Math.abs(ratio-1)<=0.25){res.cls='ok';res.text=t('cuOk',{a:a});return res;}
    res.cls='warn';
    if(!(set>0)){res.text=t('cuNeedSet',{a:a});return res;}
    var next=set*ratio,lo=set*0.7,hi=set*1.3,n=Math.round(Math.min(hi,Math.max(lo,next)));
    res.next=n;res.text=t(ratio<1?'cuLow':'cuHigh',{a:a,s:set,n:n})+((next<lo||next>hi)?t('cuCap'):'');
    return res;
  }
  return {sizeFromCirc:sizeFromCirc,freqScale:freqScale,flowmeter:flowmeter,controller:controller,signal:signal,tfrCheck:tfrCheck,copper:copper,MODELS:MODELS,r1:r1};
})();
if(typeof module!=='undefined')module.exports=CALC;
</script>
<script>
// UI layer: language, inputs, progress, render, share/install, per-device draft.
(function(){
  var KEY='tl_cuag_v1',LKEY='tl_lang',$=function(id){return document.getElementById(id);};
  var APP='https://elsaiedharfoush14.github.io/trueloop/tools/cuag/';
  var FIELDS=['site','model','peak','mat','circ','sch','pn','sdr','od','wall','up','dn','q','m91','flowNow','tfrNow','ch1','ch2','cuBg','cu1','cu2','cuT','tfrSet'];
  var manual={od:false,wall:false},lang='ar',deferred=null;
  var saved=null;try{saved=localStorage.getItem(LKEY);}catch(e){}
  lang=saved||((navigator.language||'').slice(0,2)==='en'?'en':'ar');if(!I18N[lang])lang='ar';
  function t(k,v){var s=(I18N[lang][k]!=null?I18N[lang][k]:I18N.ar[k])||k;if(v)Object.keys(v).forEach(function(n){s=s.split('{'+n+'}').join(v[n]);});return s;}
  function num(id){var x=parseFloat($(id).value);return isNaN(x)?null:x;}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function msg(el,items){el.innerHTML=items.map(function(m){return '<div class="msg '+m[0]+'">'+esc(m[1])+'</div>';}).join('');}
  var AR=/[\u0600-\u06FF]/;
  function cell(x){return '<td'+(AR.test(String(x))?' class="tx"':' class="v"')+'>'+esc(x)+'</td>';}
  function rowsHtml(rows){return rows.map(function(r){return '<tr'+(r[3]?' class="key"':'')+'>'+cell(r[0])+cell(r[1])+'<td>'+esc(r[2])+'</td></tr>';}).join('');}
  function worst(items){var o={ok:1,warn:2,bad:3},w='';items.forEach(function(m){if(!w||o[m[0]]>o[w])w=m[0];});return w;}
  function prog(n,state){var a=$('pg'+n);a.className=state||'';}
  function toast(s){$('toast').textContent=s;setTimeout(function(){$('toast').textContent='';},2200);}
  function save(){try{var d={};FIELDS.forEach(function(f){d[f]=$(f).value;});d._m=manual;localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}
  function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;FIELDS.forEach(function(f){if(d[f]!==undefined)$(f).value=d[f];});if(d._m)manual=d._m;}catch(e){}}

  function applyLang(){
    document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
    document.title='TrueLoop · '+t('title');
    document.querySelectorAll('[data-t]').forEach(function(el){var v=t(el.getAttribute('data-t'));if(el.hasAttribute('data-html'))el.innerHTML=v;else el.textContent=v;});
    $('lnAr').setAttribute('aria-pressed',lang==='ar');$('lnEn').setAttribute('aria-pressed',lang==='en');
    render();
  }

  function render(){
    var mat=$('mat').value;
    $('schL').hidden=!(mat==='cs'||mat==='ss');$('pnL').hidden=mat!=='hdpe';$('sdrL').hidden=mat!=='ppr';
    var sz=CALC.sizeFromCirc(mat,num('circ'),{sch:$('sch').value,pn:parseFloat($('pn').value),sdr:parseFloat($('sdr').value)}),sm=[];
    if(sz){
      if(!manual.od)$('od').value=sz.od;
      if(!manual.wall&&sz.wall!=null)$('wall').value=sz.wall;
      var far=sz.diffPct>3;sm.push([far?'warn':'ok',t('size',{m:sz.measured,od:sz.od,lbl:sz.label?' ('+sz.label+')':''})+(far?t('sizeFar',{d:sz.diffPct.toFixed(1)}):'')]);
      if(sz.wall==null&&!manual.wall)sm.push(['warn',t('noWall')]);
    }
    msg($('sizeMsg'),sm);
    var od=num('od'),wall=num('wall'),peak=num('peak'),cap=CALC.MODELS[$('model').value];
    var cm=peak>0&&cap?[peak>cap?['bad',t('capOver',{p:peak,c:cap})]:['ok',t('capOk',{c:cap})]]:[];
    msg($('capMsg'),cm);prog(1,peak>0?(worst(cm)||'ok'):'');

    var fm=null;
    if(od>0&&wall>0&&od>2*wall){
      fm=CALC.flowmeter({mat:mat,od:od,wall:wall,peak:peak},t);
      $('pipeInfo').innerHTML='<span>'+esc(t('idTxt'))+' <b>'+CALC.r1(fm.id)+' mm</b></span><span>'+esc(t('perMs'))+' <b>'+Math.round(fm.perMs)+' L/min</b></span>'+(peak>0?'<span>'+esc(t('velPeak'))+' <b>'+(peak/fm.perMs).toFixed(2)+' m/s</b></span>':'');
      $('fmRows').innerHTML=rowsHtml(fm.rows);
      var ct=CALC.controller(peak,fm.fs,t);$('ctRows').innerHTML=rowsHtml(ct.rows);$('tfrSet').placeholder=ct.start||'';
      prog(2,worst(sm)==='warn'?'warn':'ok');prog(3,'ok');prog(4,peak>0?'ok':'warn');
    }else{
      $('pipeInfo').innerHTML='';
      $('fmRows').innerHTML='<tr><td colspan="3" class="muted">'+esc(t('needPipe'))+'</td></tr>';
      $('ctRows').innerHTML='<tr><td colspan="3" class="muted">'+esc(t('needPipe2'))+'</td></tr>';
      prog(2,'');prog(3,'');prog(4,'');
    }
    var sg=CALC.signal(num('up'),num('dn'),num('q'),num('m91'),t);msg($('sigMsg'),sg);
    var tm=[];if(fm){var tc=CALC.tfrCheck(num('flowNow'),num('tfrNow'),fm.fs.k,t);if(tc)tm.push(tc);}
    var c1=num('ch1'),c2=num('ch2');
    if(c1!=null&&c2!=null&&Math.max(c1,c2)>1&&Math.min(c1,c2)<0.5)tm.push(['warn',t('chDead')]);
    msg($('tfrMsg'),tm);prog(5,worst(sg.concat(tm)));
    var cu=CALC.copper(num('cuBg'),num('cu1'),num('cu2'),num('cuT'),num('tfrSet'),t);
    msg($('cuMsg'),cu?[[cu.cls,cu.text]]:[]);prog(6,cu?cu.cls:'');
    $('summary').value=summary(fm,cu);
    $('repLine').textContent=t('repLine',{s:$('site').value||'—',d:new Date().toLocaleDateString(lang==='ar'?'ar-EG':'en-GB')});
    save();
  }

  function summary(fm,cu){
    var L=[],sel=function(id){var s=$(id);return s.options[s.selectedIndex].text;};
    L.push('*TrueLoop · Cu/Ag commissioning* '+$('site').value);
    L.push('Unit: '+sel('model')+(num('peak')?' | Peak flow: '+num('peak')+' L/min':''));
    if(fm){
      L.push('Pipe: '+sel('mat')+' | OD '+num('od')+' x '+num('wall')+' mm | ID '+CALC.r1(fm.id)+' mm');
      L.push('','*Flowmeter*');
      fm.rows.forEach(function(r){if(r[0]!=='M25'&&r[0]!=='M42')L.push(r[0]+' = '+r[1]);});
      L.push('','*Controller*','Minimum Current = 0.0 A','TFR at Max Flow = '+(num('tfrSet')||'?')+'  (1 pulse = '+fm.fs.k+' L)');
    }
    var ch=[];
    if(num('up')!=null)ch.push('M90 '+num('up')+'/'+(num('dn')!=null?num('dn'):'-')+' Q '+(num('q')!=null?num('q'):'-'));
    if(num('m91')!=null)ch.push('M91 '+num('m91')+'%');
    if(num('flowNow')!=null)ch.push('Flow '+num('flowNow')+' L/min | TFR '+(num('tfrNow')!=null?num('tfrNow'):'-'));
    if(num('ch1')!=null||num('ch2')!=null)ch.push('Ch1 '+(num('ch1')!=null?num('ch1'):'-')+' A | Ch2 '+(num('ch2')!=null?num('ch2'):'-')+' A');
    if(ch.length)L.push.apply(L,['','*Readings*'].concat(ch));
    if(cu&&cu.added!=null){L.push('','*Copper test*','Background '+(num('cuBg')||0)+' | avg '+cu.avg.toFixed(2)+' | added '+cu.added.toFixed(2)+' ppm (target '+num('cuT')+')');if(cu.next)L.push('Next TFR at Max Flow: '+cu.next);}
    L.push('',APP);
    return L.join('\n');
  }

  function copyText(s,ok){
    var fail=function(){$('summary').select();toast(t('copyFallback'));};
    try{navigator.clipboard.writeText(s).then(function(){toast(ok);},fail);}catch(e){fail();}
  }
  FIELDS.forEach(function(f){$(f).addEventListener('input',function(){
    if(f==='od')manual.od=$('od').value!=='';
    if(f==='wall')manual.wall=$('wall').value!=='';
    if(f==='circ'||f==='mat'||f==='sch'||f==='pn'||f==='sdr'){manual.od=false;manual.wall=false;}
    render();});});
  function setLang(l){lang=l;try{localStorage.setItem(LKEY,lang);}catch(e){}applyLang();}
  $('lnAr').addEventListener('click',function(){setLang('ar');});
  $('lnEn').addEventListener('click',function(){setLang('en');});
  $('copyBtn').addEventListener('click',function(){copyText($('summary').value,t('copied'));});
  $('linkBtn').addEventListener('click',function(){copyText(APP,t('linkCopied'));});
  $('printBtn').addEventListener('click',function(){window.print();});
  $('resetBtn').addEventListener('click',function(){
    var b=$('resetBtn');
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=t('resetConfirm');setTimeout(function(){b.dataset.armed='';b.textContent=t('reset');},3000);return;}
    FIELDS.forEach(function(f){var el=$(f);if(el.tagName==='SELECT'){var d=el.querySelector('[selected]');el.selectedIndex=d?d.index:0;}else el.value=(f==='cuT'?'0.2':'');});
    manual={od:false,wall:false};b.dataset.armed='';b.textContent=t('reset');render();window.scrollTo(0,0);
  });
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('installBtn').hidden=false;});
  $('installBtn').addEventListener('click',function(){if(deferred){deferred.prompt();deferred=null;$('installBtn').hidden=true;}});
  $('appLink').textContent=APP;
  load();applyLang();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
})();
</script>

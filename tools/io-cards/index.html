var S={step:1,rows:[],header:0,map:{tag:-1,type:-1,desc:-1,area:-1,grp:-1},catalog:[],spare:20,maxmod:8,currency:'',sep:true,project:'',result:null,error:'',busy:false,sample:false};
function TY(){var t=IOEngine.typesOf(signals().list);S.catalog.forEach(function(c){Object.keys(c.ch).forEach(function(k){if(t.indexOf(k)<0)t.push(k);});});return t;}
var x=function(){return D[TL.lang]||D.ar;}, esc=function(s){return TL.esc(String(s==null?'':s));};
var N=function(s){return '<span class="n">'+esc(s)+'</span>';};
var cell=function(r,i){return i<0||r[i]==null?'':String(r[i]).trim();};

function detect(rows){
  for(var h=0;h<Math.min(rows.length,15);h++){
    var r=rows[h].map(String),type=TLO.findCol(r,/^(type|i\/?o ?type|signal type|io|نوع)/i);
    if(type<0)continue;
    var tag=TLO.findCol(r,/tag|signal|point|رقم|تاج/i,[type]);
    return {header:h+1,map:{tag:tag,type:type,desc:TLO.findCol(r,/desc|service|وصف/i,[type,tag]),area:TLO.findCol(r,/area|panel|location|zone|منطقة|لوحة/i,[type,tag]),grp:TLO.findCol(r,/^group|مجموعة/i,[type,tag])}};
  }
  return {header:0,map:{tag:0,type:1,desc:2,area:3,grp:-1}};
}
function setRows(rows){var d=detect(rows);S.rows=rows;S.header=d.header;S.map=d.map;S.result=null;S.error='';if(!S.catalog.length)defaults();render();}
function signals(){
  var out=[],skipped=0;
  S.rows.slice(S.header).forEach(function(r){
    var tag=cell(r,S.map.tag),raw=cell(r,S.map.type),t=IOEngine.normType(raw);
    if(!tag&&!raw)return;
    if(!tag||!t){skipped++;return;}
    var s={tag:tag,type:t,desc:cell(r,S.map.desc),area:cell(r,S.map.area)||'-'};var g=cell(r,S.map.grp);if(g)s.group=g;out.push(s);
  });
  return {list:out,skipped:skipped};
}
function defaults(){S.catalog=JSON.parse(JSON.stringify(IO_SAMPLE.catalog));S.spare=IO_SAMPLE.spare_pct;S.maxmod=IO_SAMPLE.max_modules;S.currency=IO_SAMPLE.currency;S.sep=IO_SAMPLE.separate_groups!==false;S.sample=true;}
function loadSample(){
  var c=IO_SAMPLE;S.rows=[['Tag','Type','Description','Area']].concat(c.signals.map(function(s){return [s.tag,s.type,s.desc,s.area];}));
  S.header=1;S.map={tag:0,type:1,desc:2,area:3,grp:-1};defaults();S.result=null;S.error='';render();
}
function caseObj(){
  var cat=S.catalog.map(function(c){var ch={};TY().forEach(function(t){var v=TLO.num(c.ch[t]);if(v>0)ch[t]=v;});
    var o={name:c.name||'Card',ch:ch,price:TLO.num(c.price)||0};if(TLO.num(c.fixed)>0)o.fixed=Math.round(TLO.num(c.fixed));if(TLO.num(c.max_qty)>0)o.max_qty=Math.round(TLO.num(c.max_qty));return o;})
    .filter(function(c){return Object.keys(c.ch).length;});
  return {signals:signals().list,catalog:cat,spare_pct:TLO.num(S.spare)||0,max_modules:TLO.num(S.maxmod)>0?Math.round(TLO.num(S.maxmod)):0,separate_groups:S.sep};
}
function solve(){
  S.error='';S.busy=true;render();
  var c=caseObj();
  IOEngine.solve(c,TLO.solveLP).then(function(r){S.result=r;S.step=3;}).catch(function(e){S.error=e.message;}).then(function(){S.busy=false;render();});
}
function dl(){
  var rows=[['slot','card','type','channel','tag','description','area','group']];
  IOEngine.assignRows(S.result.opt.cards).forEach(function(r){var s=r.sig;rows.push([r.slot,r.card,r.type,r.ch,s?s.tag:'SPARE',s?s.desc:'',s?s.area:'',s&&s.grp?s.grp:'']);});
  TLO.download('io_channels.csv',rows);
}

function steps(){

function step1(){

      '<label>'+t.ctag+sel('tag')+'</label><label>'+t.ctype+sel('type')+'</label><label>'+t.cdesc+sel('desc')+'</label><label>'+t.carea+sel('area')+'</label><label>'+t.cgrp+sel('grp')+'</label></div>'+
      '<b>'+t.found(N(r.list.length),N(cnt),r.skipped,N(g))+'</b>'+(nocard.length&&S.catalog.length?'<div class="msg warn">'+t.notype(N(nocard.join(', ')))+'</div>':'')+
      '<label class="row" style="gap:8px"><input type="checkbox" data-sep="1" style="width:auto"'+(S.sep?' checked':'')+'> '+t.sep+'</label><p class="muted">'+t.grpHelp+' '+t.typesH+'</p>'+

      :'<p class="muted">'+t.nodata+'</p>')+'</section></div>'+

      '<td><button type="button" class="x" aria-label="remove" data-rmcat="'+i+'">×</button></td></tr>';}).join('');
  return '<p class="muted">'+t.chelp+'</p>'+(S.sample?'<div class="msg warn">'+t.budget+'</div>':'')+
    '<div class="row" style="align-items:end"><label style="width:130px">'+t.spare+'<input type="number" min="0" data-set="spare" value="'+esc(S.spare)+'"></label>'+
    '<label style="width:220px">'+t.maxmod+'<input type="number" min="0" data-set="maxmod" value="'+esc(S.maxmod)+'"></label>'+
    '<label style="width:120px">'+t.cur+'<input type="text" maxlength="6" data-set="currency" value="'+esc(S.currency)+'"></label></div>'+
    '<section class="card"><div class="tbl cat"><table>'+head+rows+'</table></div><button type="button" class="lnk" data-act="addcat">'+t.addcard+'</button></section>'+
    '<div class="row"><button type="button" data-step="1">'+t.back2+'</button><button type="button" class="pri" data-act="solve"'+(S.busy?' disabled':'')+'>'+t.solve+'</button>'+(S.busy?'<span class="muted">'+t.solving+'</span>':'')+'</div>';
}
function step3(){
  var t=x(),R=S.result,m=R.manual.s,o=R.opt.s,cur=S.currency?' '+S.currency:'',save=m.cost-o.cost,mm=caseObj().max_modules;
  var pct=m.cost?(save/m.cost*100).toFixed(1):'0';
  var k=function(l,a,b,good,extra){return '<div class="kpi"><small>'+l+'</small><b>'+N(b)+' <span class="muted" style="font-size:.85rem">← '+N(a)+'</span></b><em class="'+(good?'ok':'bad')+'">'+(extra||'')+'</em></div>';};
  var clashes=[];R.manual.cards.forEach(function(c,ci){var by={};c.sig.forEach(function(s){if(s.grp)(by[s.grp]=by[s.grp]||[]).push(s.tag);});
    Object.keys(by).forEach(function(g){if(by[g].length>1)clashes.push({card:ci,name:c.name,tags:by[g]});});});
  var mods=R.opt.cards.map(function(c,slot){
    var bars=Object.keys(c.ch).map(function(ty){var u=c.sig.filter(function(s){return s.type===ty;}).length;
      return '<div class="chb"><span class="n">'+ty+'</span><span class="tr"><b style="width:'+(u/c.ch[ty]*100)+'%"></b></span><span class="n">'+u+'/'+c.ch[ty]+'</span></div>';}).join('');
    var ar=c.sig.map(function(s){return s.area;}).filter(function(v,i,a){return a.indexOf(v)===i;});
    return '<div class="mod'+(c.fixed?' fx':'')+'"><span class="slot">'+t.slot+' '+slot+(c.fixed?' · '+t.fixedTag:'')+'</span><h4>'+esc(c.name)+'</h4>'+bars+'<span class="areas">'+esc(ar.join(' · '))+'</span></div>';}).join('');
  return '<div class="save"><div><small>'+t.man+'</small><div class="v m">'+N(TLO.f0(m.cost)+cur)+'</div></div>'+
    '<div><small>'+t.opt+'</small><div class="v">'+N(TLO.f0(o.cost)+cur)+'</div></div>'+
    '<div class="hl"><small>'+t.sav+'</small><div class="big">'+N(TLO.f0(save)+cur+' ('+pct+' %)')+'</div><span class="pv'+(R.status==='OPTIMAL'?'':' w')+'">'+(R.status==='OPTIMAL'?t.proven:t.partial)+'</span></div></div>'+
    '<div class="kpis">'+k(t.kmod,m.modules,o.modules,true,mm&&m.modules>mm?t.over+' ('+mm+') ← '+t.man:'')+k(t.kclash,m.clash,o.clash,o.clash===0,'')+k(t.karea,m.mix,o.mix,o.mix<=m.mix,'')+'</div>'+
    (clashes.length?'<section class="card"><h3>'+t.clashT+'</h3><div class="cl">'+clashes.slice(0,6).map(function(c){return '<span>'+t.slot+' '+N(c.card)+' · '+esc(c.name)+': '+N(c.tags.join(' + '))+'</span>';}).join('')+'</div></section>':'')+
    '<section class="card"><h3>'+t.rackT+'</h3><div class="rack">'+mods+'</div><p class="muted">'+t.note+'</p></section>'+
    '<div class="row no-print"><button type="button" class="pri" data-act="dl">'+t.dl+'</button>'+
    '<a class="back" href="'+WA+encodeURIComponent(t.waTxt)+'" target="_blank" rel="noopener">'+t.talk+'</a><button type="button" class="lnk" data-step="2">'+t.again+'</button></div>';
}
function report(){var t=x();return '<section class="rep"><b>TrueLoop · Optimise — '+t.repT+'</b><br>'+esc(S.project||'')+' · '+new Date().toISOString().slice(0,10)+
  ' · spare '+esc(S.spare)+' % · max '+esc(S.maxmod)+'<ul>'+t.basis.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul></section>';}
function render(){
  var app=TL.$('app'),ae=document.activeElement,fk=ae&&ae.dataset&&Object.keys(ae.dataset)[0],fv=fk&&ae.dataset[fk];
  app.innerHTML=report()+steps()+(S.step===1?step1():S.step===2?step2():step3())+(S.error?'<div class="msg bad">'+esc(S.error)+'</div>':'');
  if(fk){var el=app.querySelector('[data-'+fk+'="'+CSS.escape(fv)+'"]');if(el&&el.focus)el.focus();}
}
var app=TL.$('app');
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-step],[data-act],[data-rmcat]');if(!el||el.disabled||el.tagName==='SELECT')return;var d=el.dataset;
  if(d.step){S.step=+d.step;S.error='';render();}
  else if(d.act==='sample')loadSample();
  else if(d.act==='solve')solve();
  else if(d.act==='dl')dl();
  else if(d.act==='addcat'){S.catalog.push({name:'',ch:{},price:''});render();}
  else if(d.rmcat){S.catalog.splice(+d.rmcat,1);render();}
});
app.addEventListener('change',function(e){var d=e.target.dataset;
  if(e.target.id==='file'&&e.target.files[0])TLO.readFile(e.target.files[0]).then(setRows).catch(function(err){S.error='File: '+err.message;render();});
  else if(d.map){S.map[d.map]=+e.target.value;render();}
  else if(d.sep){S.sep=e.target.checked;S.result=null;render();}
});
app.addEventListener('input',function(e){var d=e.target.dataset;
  if(e.target.id==='paste'){var v=e.target.value;if(v.trim()){setRows(TLO.parseText(v));var p=TL.$('paste');if(p){p.value=v;p.focus();}}}
  else if(d.set){S[d.set]=e.target.value;S.result=null;}
  else if(d.cat){var q=d.cat.split('|'),c=S.catalog[+q[0]];if(q[1].indexOf('ch.')===0)c.ch[q[1].slice(3)]=e.target.value;else c[q[1]]=e.target.value;S.result=null;if(q[1]==='price')S.sample=false;}
});
app.addEventListener('dragover',function(e){var z=e.target.closest('#drop');if(z){e.preventDefault();z.classList.add('over');}});
app.addEventListener('dragleave',function(e){var z=e.target.closest('#drop');if(z)z.classList.remove('over');});
app.addEventListener('drop',function(e){var z=e.target.closest('#drop');if(z){e.preventDefault();if(e.dataTransfer.files[0])TLO.readFile(e.dataTransfer.files[0]).then(setRows).catch(function(err){S.error='File: '+err.message;render();});}});
TL.init({root:'../../',dict:D,title:'title',ver:VER,id:'io-cards',onLang:render});
TL.$('verTxt').textContent='v'+VER;
TL.$('printBtn').onclick=function(){window.print();};
TL.applyLang();
render();
})();
</script>
</body>
</html>

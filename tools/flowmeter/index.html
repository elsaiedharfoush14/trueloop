var F=['site','mat','circ','sch','pn','sdr','od','wall','lin','units','peak','oMa','oPu','oFr','oRe','puv','puw','rem','reth','up','dn','q','m91'];
var st=TL.store('tl_flow_v1',F),manual={od:false,wall:false},$=TL.$,num=TL.num,t=function(k,v){return TL.t(k,v);};
var MULT=['0. x0.001','1. x0.01','2. x0.1','3. x1','4. x10','5. x100','6. x1000','7. x10000'];

function render(){
  var mat=$('mat').value;
  $('schL').hidden=!(mat==='cs'||mat==='ss');$('pnL').hidden=mat!=='hdpe';$('sdrL').hidden=mat!=='ppr';
  var sz=TL.pipe.sizeFromCirc(mat,num('circ'),{sch:$('sch').value,pn:parseFloat($('pn').value),sdr:parseFloat($('sdr').value)}),sm=[];
  if(sz){if(!manual.od)$('od').value=sz.od;if(!manual.wall&&sz.wall!=null)$('wall').value=sz.wall;
    var far=sz.diffPct>3;sm.push([far?'warn':'ok',t('size',{m:sz.measured,od:sz.od,lbl:sz.label?' ('+sz.label+')':''})+(far?t('sizeFar',{d:sz.diffPct.toFixed(1)}):'')]);
    if(sz.wall==null&&!manual.wall)sm.push(['warn',t('noWall')]);}
  TL.msg($('sizeMsg'),sm);
  var od=num('od'),wall=num('wall'),ok=od>0&&wall>0&&od>2*wall,id=ok?od-2*wall:0,pm=ok?TL.pipe.perMs(id):0;
  var u=$('units').value,uLbl=u==='m3h'?'m³/h':'L/min',peak=num('peak'),peakL=peak>0?(u==='m3h'?peak*1000/60:peak):null;
  $('pipeInfo').innerHTML=ok?'<span>'+TL.esc(t('idTxt'))+' <b>'+TL.r1(id)+' mm</b></span><span>'+TL.esc(t('perMs'))+' <b>'+(u==='m3h'?(pm*60/1000).toFixed(1)+' m³/h':Math.round(pm)+' L/min')+'</b></span>'+(peakL?'<span>'+TL.esc(t('velPeak'))+' <b>'+(peakL/pm).toFixed(2)+' m/s</b></span>':''):'';
  TL.prog(1,ok?(TL.worst(sm)==='warn'?'warn':'ok'):'');
  $('puBox').hidden=!$('oPu').checked;$('reBox').hidden=!$('oRe').checked;
  var om=[];
  if(($('oMa').checked||$('oFr').checked)&&!peakL)om.push(['warn',t('needPeak')]);
  if($('oPu').checked&&peakL){var v=parseFloat($('puv').value),w=parseFloat($('puw').value),need=Math.ceil(peakL/v),max=Math.floor(60000/(2*w));om.push(need<=max*0.8?['ok',t('puOk',{n:need,m:max})]:['bad',t('puBad',{n:need,m:max})]);}
  if($('oPu').checked)om.push(['warn',t('puNote')]);
  if($('oRe').checked)om.push(['warn',t('reNote')]);
  TL.msg($('outMsg'),om);TL.prog(2,($('oMa').checked||$('oPu').checked||$('oFr').checked||$('oRe').checked)?(TL.worst(om)==='bad'?'bad':'ok'):'');

  var rows=[];
  if(ok){
    var plastic=mat==='hdpe'||mat==='ppr'||mat==='pvc',z=od>300||(plastic&&wall>20);
    rows.push(['§',t('grpPipe')],['M11',TL.r1(od),t('r11')],['M12',wall,t('r12',{id:TL.r1(id)})],['M14',TL.pipe.M14[mat],TL.pipe.SOUND[mat]?t('r14o'):t('r14s')]);
    if(TL.pipe.SOUND[mat])rows.push(['M15',TL.pipe.SOUND[mat],t('r15')]);
    rows.push(['M16',$('lin').options[$('lin').selectedIndex].value==='0'?'0. None':$('lin').options[$('lin').selectedIndex].text,t('r16')],['M20','0. Water',t('r20')],
      ['M23',TL.pipe.transducer(od),t('r23')],['M24',z?t('r24zv'):'V',z?t('r24z'):t('r24v')],['M25',t('r25v'),t('r25')]);
    var pv=$('oPu').checked?parseFloat($('puv').value):1,cubic=pv>=1000,mult=cubic?pv/1000:pv,mi=Math.round(Math.log10(mult))+3;
    rows.push(['§',t('grpUnits')],['M30','Metric',''],['M31',uLbl,t('r31')],['M32',cubic?'Cubic Meter':'Liter',t('r32')],['M33',MULT[mi],$('oPu').checked?t('r33p'):t('r33')],
      ['M34 / M35 / M36','On / On / Off',''],['M40','5–10',t('r40')],['M41','0.03',t('r41')]);
    var anyOut=$('oMa').checked||$('oPu').checked||$('oFr').checked||$('oRe').checked;
    if(anyOut)rows.push(['§',t('grpOut')]);
    if($('oMa').checked){var hi=peak>0?Math.ceil(peak*1.2):'?';rows.push(['M55','0. 4-20mA',t('r55'),1],['M56','0',t('r56'),1],['M57',hi+' '+uLbl,t('r57'),1],['M58','4 / 12 / 20 mA',t('r58')]);}
    if($('oPu').checked){rows.push(['M78','9. POS Int Pulse',t('r78p'),1],['M54',$('puw').value+' ms',t('r54'),1]);}
    if($('oFr').checked){var need2=Math.max(peakL||0,1)*1.2,fm=[10,20,50].filter(function(f){return f*60>=need2;})[0],m69,k;
      if(fm){m69=fm*60;k=1;}else{fm=50;m69=Math.ceil(need2/500)*500;k=m69/3000;}
      var m69u=u==='m3h'?TL.r1(m69*60/1000)+' m³/h':m69+' L/min';
      rows.push(['M78','24. Flow Rate Pulse',t('r78f'),1],['M67','0 – '+fm+' Hz',t('r67'),1],['M68','0',t('r68'),1],['M69',u==='m3h'?TL.r1(m69*60/1000):m69,t('r69',{f:fm,m:m69u,k:k+' L'}),1]);}
    if($('oRe').checked){var md=$('rem').value,th=num('reth')||0;
      if(md==='fault')rows.push(['M79','0. No Signal',t('r79f'),1]);
      else if(md==='run')rows.push(['M79','6. Alarm #1',t('r79a'),1],['M73','-99999',t('r73r')],['M74',th,t('r74r'),1]);
      else rows.push(['M79','6. Alarm #1',t('r79a'),1],['M73',th,t('r73l'),1],['M74','99999',t('r74l')]);}
    rows.push(['§',t('grpEnd')],['M42','Set Zero',t('r42')],['M26','ENT',t('r26')]);
    $('fmRows').innerHTML=TL.rows(rows);TL.prog(3,'ok');
  }else{$('fmRows').innerHTML='<tr><td colspan="3" class="muted">'+TL.esc(t('needPipe'))+'</td></tr>';TL.prog(3,'');}

  var sg=[],up=num('up'),dn=num('dn'),q=num('q'),m91=num('m91');
  ['g0','g1','g2','g3'].forEach(function(g){$(g).className='';});
  if(up>0||dn>0){var lo=Math.min(up||99,dn||99),gi=lo<60?0:lo<75?1:lo<=80?2:3;$('g'+gi).className='on';
    sg.push(gi===0?['bad',t('sigBad',{v:lo})]:gi===1?['warn',t('sigMid',{v:lo})]:['ok',t('sigOk',{v:lo,g:t('g'+gi)})]);}
  if(q>0)sg.push(q>=60?['ok',t('qOk',{v:q})]:['bad',t('qBad',{v:q})]);
  if(m91>0)sg.push(m91>=97&&m91<=103?['ok',t('m91Ok',{v:m91})]:['bad',t(m91<97?'m91Low':'m91High',{v:m91})]);
  TL.msg($('sigMsg'),sg);TL.prog(4,TL.worst(sg));TL.prog(5,'');
  $('summary').value=summary(rows,sg);
  $('repLine').textContent=t('repLine',{s:$('site').value||'—',d:new Date().toLocaleDateString(TL.lang==='ar'?'ar-EG':'en-GB')});
  st.save(manual);
}
function summary(rows,sg){
  var L=['*TrueLoop · Flowmeter setup* '+$('site').value];
  rows.forEach(function(r){if(r[0]==='§')L.push('','*'+r[1]+'*');else if(r[0]!=='M25')L.push(r[0]+' = '+r[1]);});
  if(num('up')!=null||num('m91')!=null)L.push('','*Signal*','M90 '+(num('up')||'-')+'/'+(num('dn')||'-')+' Q '+(num('q')||'-')+' | M91 '+(num('m91')||'-')+'%');
  L.push('',URL_APP);return L.join('\n');
}
TL.init({root:'../../',dict:D,title:'title',ver:VER,id:'flowmeter',onLang:render});
var x=st.load();if(x)manual=x;
F.forEach(function(f){var el=$(f);el.addEventListener(el.type==='checkbox'?'change':'input',function(){
  if(f==='od')manual.od=$('od').value!=='';if(f==='wall')manual.wall=$('wall').value!=='';
  if(f==='circ'||f==='mat'||f==='sch'||f==='pn'||f==='sdr'){manual.od=false;manual.wall=false;}render();});});
$('copyBtn').onclick=function(){TL.copy($('summary').value,null,$('summary'));};
$('linkBtn').onclick=function(){TL.copy(URL_APP,TL.t('linkCopied'));};
$('printBtn').onclick=function(){window.print();};
$('resetBtn').onclick=function(){var b=this;if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=TL.t('resetConfirm');setTimeout(function(){b.dataset.armed='';b.textContent=TL.t('reset');},3000);return;}
  st.clear();location.reload();};
$('appLink').textContent=URL_APP;$('verTxt').textContent='v'+VER;
if(!$('oMa').checked&&!$('oPu').checked&&!$('oFr').checked&&!$('oRe').checked)$('oMa').checked=true;
TL.applyLang();
})();
</script>

short:'Booster',title:'Booster Sequencing on LS H100 Drives',
intro:'Booster pumps, each on its own <code>LS H100</code> drive, with no <code>PLC</code> and no <code>RS-485</code> link. Choose the pumps, pressure and timings; the tool draws the panel and gives every drive\'s parameters, tests and maintenance.',
abT:'What does this system do?',abLead:'It keeps the building water pressure steady whatever the demand. One pump runs on a variable-speed drive; when demand rises, assist pumps join, and when it drops they leave.',
abHowT:'How it works',abHow:'One pressure transmitter feeds drive 1 (the master), which runs its pump on PID to hold the setpoint. If it reaches high speed and pressure is still low for a set time, it closes a relay that starts an assist pump\'s drive at fixed speed (the MMC function). When demand falls it stops it. Every few hours it rotates the assist order so pumps share the hours, and it skips a drive that has tripped.',
abRolesT:'Pump roles',abRoles:'<li><b>Pump 1 (Lead):</b> always starts first, on PID.</li><li><b>Assist:</b> joins after the delay if pressure stays low.</li><li><b>Standby:</b> only runs if a pump fails, or after a changeover.</li><li><b>Changeover:</b> the assist order rotates on a timer.</li>',

  $('dPow').innerHTML=drawPower(c,kw);$('dSig').innerHTML=drawSignals(c,es);$('dLamp').innerHTML=drawLamps(c,es);$('bxSheet').hidden=!es;if(es)$('dBx').innerHTML=drawBx(c);
  $('bomRows').innerHTML=TL.rows(bom(c,kw));TL.prog(3,kw?'ok':'warn');
  var mr=master(c),ar=auxRows();$('mRows').innerHTML=TL.rows(mr);$('aRows').innerHTML=TL.rows(ar)+'<tr><td colspan="3" class="muted">'+TL.esc(t('aKey'))+'</td></tr>';TL.prog(4,'ok');
  var items=['c1',es?'c2':null,'c3','c4','c5','c6','c7'].filter(Boolean),vars={c3:{f:num('fon'),d:num('adf'),t:num('adt')},c4:{f:num('foff'),t:num('sdt')}};
  $('chk').innerHTML=items.map(function(k){var on=!!checks[k];return '<label class="'+(on?'done':'')+'"><input type="checkbox" data-k="'+k+'"'+(on?' checked':'')+'><span>'+TL.esc(t(k,vars[k]))+'</span></label>';}).join('');
  var done=items.filter(function(k){return checks[k];}).length;TL.prog(5,done===items.length?'ok':(done?'warn':''));TL.prog(6,'');
  $('summary').value=summary(c,kw,mr,ar,items,done);
  $('repLine').textContent=t('repLine',{s:$('site').value||'—',d:new Date().toLocaleDateString(TL.lang==='ar'?'ar-EG':'en-GB')});
  st.save(checks);
}
function summary(c,kw,mr,ar,items,done){
  var L=['*TrueLoop · Booster (LS H100)* '+$('site').value,'Pumps: '+c.n+' (lead 1, assist '+c.op+', standby '+(c.aux-c.op)+')'+(kw?' | '+kw+' kW':''),'Setpoint '+num('sp')+' bar | TX 0–'+$('rng').value+' bar | changeover '+$('co').value,'','*VFD1 master*'];
  mr.forEach(function(r){if(r[0]!=='§')L.push(r[0]+' = '+r[1]);});
  L.push('','*VFD2–'+c.n+' assist*');ar.forEach(function(r){L.push(r[0]+' = '+r[1]);});
  L.push('','Tests: '+done+'/'+items.length,'',URL_APP);return L.join('\n');
}
TL.init({root:'../../',dict:D,title:'title',ver:VER,id:'booster',onLang:render});
var x=st.load();if(x)checks=x;
F.forEach(function(f){$(f).addEventListener(f==='np'||f==='sbn'||f==='kw'||f==='rng'||f==='es'||f==='co'?'change':'input',render);});
$('chk').addEventListener('change',function(e){var k=e.target.getAttribute('data-k');if(k){checks[k]=e.target.checked;render();}});
$('copyBtn').onclick=function(){TL.copy($('summary').value,null,$('summary'));};
$('linkBtn').onclick=function(){TL.copy(URL_APP,TL.t('linkCopied'));};
$('printBtn').onclick=function(){window.print();};
$('resetBtn').onclick=function(){var b=this;if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=TL.t('resetConfirm');setTimeout(function(){b.dataset.armed='';b.textContent=TL.t('reset');},3000);return;}st.clear();location.reload();};
$('appLink').textContent=URL_APP;$('verTxt').textContent='v'+VER;
TL.applyLang();
})();
</script>

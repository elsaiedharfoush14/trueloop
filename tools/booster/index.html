 abPartsT:'مكوّناته',abParts:'<li>طلمبات على مجمّع سحب وطرد واحد.</li><li>درايف لكل طلمبة.</li><li>حساس ضغط 4–20 mA على خط الطرد.</li><li>تانك ضغط صغير يقلّل التشغيل والوقوف.</li><li>عوامة أو حساس ضغط سحب للحماية من التشغيل على الناشف.</li>',

en:{short:'Booster programming',title:'Booster Programming',intro:'Pick the drive make in the panel. Each tool gives that make\'s parameters, wiring, commissioning tests and maintenance.',

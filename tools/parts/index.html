 ['ABS103c','drive','LS MCCB for H100 18.5–22 kW (400 V)','LS MCCB · H100 18.5–22 kW (400 V)','100 A',M_H100],
 ['TS-2','flow','حساس تراسونيك صغير clamp-on','Small clamp-on transducer','DN25–100 · −30…90 °C',M_TUF],
 ['TM-1','flow','حساس تراسونيك متوسط clamp-on','Medium clamp-on transducer','DN50–700 · −30…90 °C',M_TUF],

  var q=(TL.$('q').value||'').trim().toLowerCase(),cats=['all','drive','flow','cuag','test'];

function closedSens(x){
  var o={},w=[];
  o.SP=Math.round((x.C0+x.nLo*x.k/100)/10)*10;o.UP=Math.round((x.C0+x.nHi*x.k/100)/10)*10;o.DB=-(o.UP-o.SP);
  o.mgph=x.Qi*x.Si*10*1000/(x.V*1000);o.usph=o.mgph*x.k/100;o.tBand=(o.UP-o.SP)/o.usph;o.TLh=Math.max(1,Math.ceil(o.tBand*x.tlf));
  o.kgInit=x.V*x.nHi/1000;o.fills=Math.ceil(o.kgInit/x.kgFill);o.kgTank=x.Ti*x.Si/100;
  o.HIC=rup(o.UP+0.5*(o.UP-x.C0),100);o.bmsLo=o.SP-Math.round((o.UP-o.SP)/10)*10;o.bmsHi=o.HIC-200;
  o.cdHigh=[2000,5000,10000,20000].filter(function(s){return s>=1.5*o.HIC;})[0]||20000;
  o.bL=x.V*x.bDose/1000/x.bRho;o.bMin=o.bL*1000/x.Qb;o.bActv=x.bDose*x.bAct/100;o.bYear=o.bL*52/x.wk;
  if(o.SP<=x.C0)w.push(['bad',t('w1')]);if(o.DB>-50)w.push(['warn',t('w2')]);if(o.TLh>12)w.push(['warn',t('w3',{h:o.TLh})]);
  if(o.tBand<0.25)w.push(['warn',t('w4')]);if(x.nLo>=x.nHi)w.push(['bad',t('w5')]);if(o.bMin>360)w.push(['warn',t('w6')]);
  if(x.wk>1)w.push(['warn',t('w7',{n:x.wk})]);if(o.cdHigh>5000)w.push(['warn',t('w8',{s:o.cdHigh})]);
  kpi([[o.SP+' / '+o.UP,t('k1')],[r(o.usph,1)+' µS/h',t('k2')],[r(o.kgInit,1)+' kg',t('k3')+' ('+o.fills+')'],[r(o.bL,1)+' L · '+hhmm(o.bMin),t('k4')]]);
  var M=['thMenuF','thField','thVal','thWhy'],h='';
  h+=sec('gA',tbl(M,[['Bleed','Setpoint',o.SP+' µS','C0 '+x.C0+' + '+x.nLo+' × '+x.k+'/100'],
    ['Bleed','Dead Band','<b>-'+(o.UP-o.SP)+'</b>',L('السالب بيعكس القناة: الطلمبة تشتغل تحت '+o.SP+' وتقف عند '+o.UP+'. اكتب "-" الأول.','Minus inverts the channel: ON below '+o.SP+', OFF at '+o.UP+'. Enter "-" first.')],
    ['Bleed','Time Limit',hm(o.TLh*60),L('النطاق بياخد '+r(o.tBand,1)+' ساعة على '+r(o.usph,1)+' µS/h × '+x.tlf,'Band takes '+r(o.tBand,1)+' h at '+r(o.usph,1)+' µS/h × '+x.tlf)],
    ['Bleed','Manual Bleed',L('ما تدخلش','do not enter'),L('أي وقت فيه بيشغّل الطلمبة فورًا','Any time there starts the pump at once')],
    ['Inhibitor','Mode','Feed &amp; Bleed',L('طلمبة المانع على 2-E-N بتتبع قناة Bleed','Inhibitor pump on 2-E-N follows the Bleed channel')]]),
    L('الطلمبة بتزوّد '+r(o.mgph,1)+' mg/L نيتريت في الساعة. تانك '+x.Ti+' L = '+r(o.kgTank,1)+' kg = '+r(o.kgTank*1000/x.V,0)+' mg/L في الدايرة.','Pump adds '+r(o.mgph,1)+' mg/L NaNO2 per hour. One '+x.Ti+' L tank = '+r(o.kgTank,1)+' kg = '+r(o.kgTank*1000/x.V,0)+' mg/L in the loop.'));
  h+=sec('gB',tbl(['thStep','thAct','thVal','thNote'],[['1',L('قيس C0 والدايرة مليانة وبتلف','Measure C0 with the loop full and circulating'),x.C0+' µS',L('اكتب القيمة الحقيقية فوق','Enter the real value above')],
    ['2',L('نيتريت للوصول للحد الأعلى','NaNO2 to reach HIGH'),r(o.kgInit,1)+' kg',x.V+' m³ × '+x.nHi+' mg/L'],['3',L('عدد التعبئات','Pot fills'),o.fills+' × '+x.kgFill+' kg',L('ادوّب في مية دافية، واستنى لفة كاملة بين كل تعبئة','Dissolve in warm water; one turnover between fills')],
    ['4',L('وقّف لما الكنترولر يقرا','Stop when the controller reads'),o.UP+' µS',L('واختبر نيتريت وصحّح المعامل '+x.k,'Then lab-test nitrite and correct the factor '+x.k)],['5',L('املا تانك المحلول','Fill the solution tank'),r(o.kgTank,1)+' kg / '+x.Ti+' L',x.Si+' %']]));
  h+=sec('gC',tbl(M,[['Biocide 2','PBLD Time','00h00',L('دايرة مقفولة: مفيش تصريف','Closed loop: no bleed before the dose')],['Biocide 2','PBIO','00h00',''],['Biocide 2','LCK','00h00',''],
    ['Biocide 2','Week 1 · '+TL.esc(dayName(x.day)),hhmm(o.bMin)+' @ '+x.bt,r(o.bL,1)+' L / '+x.Qb+' mL/min'],['Biocide 2',L('باقي الأيام والأسابيع','Other days / weeks'),'Off',''],['Options','NUMBER WEEK',String(x.wk),''],['Biocide 1',L('كل الأيام','All days'),'Off','']]),
    L('الجرعة '+x.bDose+' mg/L منتج = '+r(o.bActv,0)+' mg/L مادة فعالة. حوالي '+r(o.bYear,0)+' L في السنة. عاير الطلمبة الأول بالـ mL/min.','Dose '+x.bDose+' mg/L product = '+r(o.bActv,0)+' mg/L active. About '+r(o.bYear,0)+' L per year. Calibrate the pump in mL/min first.'));
  var flow=x.hwFlow?['FLOW = NORMAL, NFW = STOP',L('الحقن يقف لما طلمبات التشيلد ووتر تقف','Dosing stops when CHW pumps stop')]:['FLOW = DISABLED, NFW = NO',L('مفيش flow switch: المدخل المفتوح هيمنع الحقن. طلمبات الدايرة لازم 24/7','No flow contact: an open input would block dosing. CHW pumps must run 24/7')];
  h+=sec('gD',tbl(M,[['Alarm','HIC','ABS '+o.HIC,L('جرعة زيادة: ABS بيوقف كل المخارج','Overdose: ABS stops all outputs')],['Alarm','HPH','ABS '+r(x.pHi,1),''],
    ['Alarm','LOC','OFF',L('ABS هيوقف طلمبة المانع نفسها. الإنذار في الـ BMS','ABS would stop the inhibitor pump too. Monitor in the BMS')],['Alarm','LPH','OFF',L('نفس السبب','Same reason')],['Alarm','OUT AL','EN',L('كونتاكت إنذار 10-11-12 للـ BMS','Common alarm 10-11-12 to the BMS')],
    ['Alarm','CLS',x.hwLvl?'STOP':'NO',x.hwLvl?L('التانك الفاضي يوقف طلمبته','Empty tank stops its pump'):L('مفيش حساسات مستوى','No level probes')],['Options','FLOW',flow[0],flow[1]],
    ['Options','OUT CURRENT','4/20',L('الـ BMS يعرف لو الكابل اتقطع','BMS detects a broken cable')],['Options','Cd mA Low / High','0 / '+o.cdHigh,''],['Options','pH mA Low / High','0 / 14',''],
    ['Options','Temp mA LO / HI',x.hwT?'0 / 50':L('مش مستخدم','not used'),''],['Options','IF ALARM','ENABLE','']]));
  h+=sec('gE',tbl(['thAlarm','thLogic','thDelay','thAct'],[[L('إنذار عام','Common alarm'),'DI','10 s','Status Alarm'],
    [L('موصلية واطية','Low conductivity'),'AI &lt; '+o.bmsLo+' µS'+(x.hwChg?L(' (بعد الشحنة)',' (after the charge)'):''),'60 min',L('تانك، طلمبة، تعبئة','Tank, pump, pot fill')],
    [L('موصلية عالية','High conductivity'),'AI &gt; '+o.bmsHi+' µS','30 min',L('اختبر نيتريت','Test nitrite')],['pH '+L('واطي','low'),'AI &lt; '+r(x.pLo,1),'60 min',''],['pH '+L('عالي','high'),'AI &gt; '+r(x.pHi,1),'30 min',''],
    [L('عطل إشارة','Signal fault'),'AI &lt; 3.6 / &gt; 21 mA','60 s',L('كابل أو الكنترولر مقفول','Cable or controller off')],[L('حقن المانع طويل','Inhibitor dosing too long'),'DI ON &gt; '+(o.TLh+2)+' h','-',L('تانك فاضي / طلمبة','Tank empty / pump')],
    [L('البايوسايد ما اتحقنش','Biocide missed'),'DI ≥ '+Math.round(o.bMin*0.7)+' min / '+(x.wk*7+1)+' d','-',L('الساعة والتانك','Clock and tank')]]));

    ['2','Manual ON / OFF',L('الطلمبة تشتغل والـ BMS يشوف','Pump runs, BMS sees it'),'☐'],['3',L('علّي SP فوق القراية','Raise SP above the reading'),L('طلمبة المانع تشتغل','Inhibitor pump starts'),'☐'],
    ['4','Time Limit 00h01','Bleed Timeout '+L('بعد دقيقة، ورجّع ','after 1 min; put back ')+hm(o.TLh*60),'☐'],['5',L('البايوسايد بعد دقيقتين','Biocide 2 min ahead'),L('تشتغل المدة وتقف','Runs and stops'),'☐'],
    ['6',L('نيتريت معمل بعد 24 ساعة','Lab nitrite after 24 h'),x.nLo+'–'+x.nHi+' mg/L','☐']]),t('srcNote'));

function closedNone(x){
  var w=[],kg=x.V*x.nHi/1000,fills=Math.ceil(kg/x.kgFill),bL=x.V*x.bDose/1000/x.bRho,bMin=bL*1000/x.Qb;

  kpi([[r(kg,1)+' kg',t('k3')+' ('+fills+')'],[r(bL,1)+' L · '+hhmm(bMin),t('k4')]]);
  var ex=[x.nLo-100,x.nLo,Math.round((x.nLo+x.nHi)/2)].map(function(m){var add=Math.max(0,x.V*(x.nHi-m)/1000);return [m+' mg/L',add?r(add,1)+' kg':'0',add?Math.ceil(add/x.kgFill)+' × '+x.kgFill+' kg':'-',m<x.nLo?L('زوّد دلوقتي','Top up now'):L('لا، اختبر الأسبوع الجاي','No, test next week')];});
  var h=sec('gN1',tbl(['thStep','thAct','thVal','thNote'],[['1',L('قيس النيتريت في مية التعبئة (لو موجود)','Test nitrite in the fill water (if any)'),'mg/L',''],['2',L('نيتريت للحد الأعلى','NaNO2 to HIGH'),r(kg,1)+' kg',x.V+' m³ × '+x.nHi],['3',L('على pot feeder','Through the pot feeder'),fills+' × '+x.kgFill+' kg',L('لفة كاملة بين كل تعبئة','One turnover between fills')],['4',L('اختبار بعد 24 ساعة','Test after 24 h'),x.nLo+'–'+x.nHi+' mg/L','']]));
  h+=sec('gN2',tbl(['thItem','thVal','thStep','thNote'],ex),L('الكمية = الحجم × (الحد الأعلى − القراية) ÷ 1000.','kg = volume × (HIGH − reading) ÷ 1000.'));
  h+=sec('gN3',tbl(['thStep','thAct','thVal','thNote'],[['1',L('تايمر أسبوعي على طلمبة البايوسايد','Weekly timer on the biocide pump'),hhmm(bMin)+' @ '+x.bt,TL.esc(dayName(x.day))+L(' كل '+x.wk+' أسبوع',' every '+x.wk+' wk')],['2',L('أو يدوي على pot feeder','Or by hand through the pot feeder'),r(bL,1)+' L','']]));
  h+=sec('gN4',tbl(['thStep','thItem','thExp',''],[['1',L('اختبار نيتريت','Nitrite test'),x.nLo+'–'+x.nHi+' mg/L','☐'],['2','pH',r(x.pLo,1)+'–'+r(x.pHi,1),'☐'],['3',L('مستوى تانك البايوسايد','Biocide tank level'),L('يكفي الجرعة الجاية','Enough for the next shot'),'☐'],['4',L('سجّل في اللوج','Log it'),'','☐']]));
  return {h:h,w:w,sum:['Initial charge '+r(kg,1)+' kg','Top-up kg = V × (HIGH − test)/1000','Biocide '+r(bL,1)+' L every '+x.wk+' wk']};
}
function towerBalance(x){var E=x.Q*x.dT*0.00153,D=x.Q*x.drift/100,Bt=x.coc>1?E/(x.coc-1):0,Bb=Math.max(0,Bt-D),M=E+Bt;return {E:E,D:D,Bt:Bt,Bb:Bb,M:M};}
function towerSens(x){
  var w=[],b=towerBalance(x);if(x.coc<=1)w.push(['bad',t('w9')]);if(x.coc>6&&x.Cm>800)w.push(['warn',t('w12')]);
  var SP=Math.round(x.Cm*x.coc/10)*10,DB=Math.max(20,Math.round(SP*0.05/10)*10),open=b.Bb/x.valve,
      tDrop=x.valve>0&&SP>x.Cm?-Math.log(1-DB/(SP-x.Cm))*x.Vt/x.valve:0,tlH=Math.max(1,Math.ceil(tDrop*1.5)),
      kgDay=b.Bt*24*x.ppm/1000,LDay=kgDay/x.iRho,needQ=open>0?LDay/(open*24):0,mlPerM3=x.ppm/x.coc/x.iRho;
  if(open>0.5)w.push(['warn',t('w10',{p:Math.round(open*100)})]);if(needQ>x.Qi)w.push(['bad',t('w11',{q:r(needQ,2),Qi:x.Qi})]);
  var bL=x.Vt*x.bDose/1000/x.bRho,bMin=bL*1000/x.Qb,HIC=rup(SP*1.25,100),cd=[2000,5000,10000,20000].filter(function(s){return s>=1.5*HIC;})[0]||20000;
  if(bMin>360)w.push(['warn',t('w6')]);if(x.wk>1)w.push(['warn',t('w7',{n:x.wk})]);
  kpi([[r(b.E,2)+' m³/h',t('k5')],[r(b.Bt,2)+' m³/h',t('k6')],[r(b.M,2)+' m³/h',t('k7')],[SP+' µS',t('k9')],[r(LDay,1)+' L',t('k8')]]);
  var M=['thMenuF','thField','thVal','thWhy'],h='';
  h+=sec('gT1',tbl(['thItem','thVal','thNote',''],[[L('تبخر E','Evaporation E'),r(b.E,2)+' m³/h','Q × ΔT × 0.00153',''],[L('رذاذ','Drift'),r(b.D,3)+' m³/h','Q × '+x.drift+'%',''],[L('تصريف كلي','Total blowdown'),r(b.Bt,2)+' m³/h','E ÷ (COC − 1)',''],[L('من المحبس','Through the valve'),r(b.Bb,2)+' m³/h',L('التصريف − الرذاذ','blowdown − drift'),''],[L('مية تعويض','Makeup'),r(b.M,2)+' m³/h = '+r(b.M*24,0)+' m³/'+L('يوم','day'),'E + B','']]));
  h+=sec('gT2',tbl(M,[['Bleed','Setpoint',SP+' µS',x.Cm+' × COC '+x.coc],['Bleed','Dead Band','+'+DB,L('التصريف يفتح فوق '+SP+' ويقفل عند '+(SP-DB),'Valve opens above '+SP+', closes at '+(SP-DB))],['Bleed','Time Limit',hm(tlH*60),L('النزول '+DB+' µS بياخد '+r(tDrop,1)+' ساعة × 1.5','Dropping '+DB+' µS takes '+r(tDrop,1)+' h × 1.5')]]),
    L('المحبس هيفتح حوالي '+Math.round(open*100)+'% من الوقت ('+r(open*24,1)+' ساعة في اليوم).','The valve will be open about '+Math.round(open*100)+'% of the time ('+r(open*24,1)+' h/day).'));
  h+=sec('gT3',tbl(M,[['Inhibitor','Mode','Feed &amp; Bleed',L('الطلمبة تشتغل مع التصريف','Pump runs with the blowdown')],[L('الاستهلاك','Use'),L('في اليوم','per day'),r(kgDay,2)+' kg = '+r(LDay,1)+' L','B × 24 × '+x.ppm+' mg/L'],[L('الطلمبة المطلوبة','Pump needed'),'L/h',r(needQ,2),L('اليومي ÷ ساعات فتح المحبس','daily ÷ valve hours')],[L('لو فيه عداد مية تعويض','With a makeup meter'),'mL / m³',r(mlPerM3,0),x.ppm+' ÷ COC ÷ '+x.iRho]]),t('towNote'));
  h+=sec('gT4',tbl(M,[['Biocide','PBLD',L('30 دقيقة (بداية)','30 min (start)'),L('تصريف قبل الجرعة علشان مفيش تصريف بعدها','Pre-bleed so no bleed is needed after')],['Biocide','LCK',L('ساعتين (بداية)','2 h (start)'),L('قفل التصريف علشان البايوسايد ياخد وقته','Bleed lockout for contact time')],['Biocide','Week 1 · '+TL.esc(dayName(x.day)),hhmm(bMin)+' @ '+x.bt,r(bL,1)+' L / '+x.Qb+' mL/min'],['Options','NUMBER WEEK',String(x.wk),L('بدّل نوعين بايوسايد لو متاح (Biocide 1 / 2)','Alternate two biocides if available (Biocide 1 / 2)')]]),t('towNote'));
  var flow=x.hwFlow?'FLOW = NORMAL, NFW = STOP':'FLOW = DISABLED, NFW = NO';
  h+=sec('gT5',tbl(M,[['Alarm','HIC','ABS '+HIC,L('موصلية عالية جدًا: المحبس مش شغال','Very high: valve not working')],['Alarm','LOC','OFF',L('الإنذار في الـ BMS','Monitor in the BMS')],['Alarm','HPH / LPH',r(x.pHi,1)+' / '+r(x.pLo,1),''],['Alarm','CLS',x.hwLvl?'STOP':'NO',''],['Options','FLOW',flow,''],['Options','Cd mA Low / High','0 / '+cd,'']]));
  h+=sec('gT6',tbl(['thStep','thItem','thExp',''],[['1',L('محبس التصريف من Manual','Blowdown valve in Manual'),L('يفتح ويقفل، وفلو '+x.valve+' m³/h','Opens and closes, '+x.valve+' m³/h'),'☐'],['2',L('علّي SP تحت القراية','Lower SP below the reading'),L('المحبس يفتح والمانع يحقن','Valve opens, inhibitor doses'),'☐'],['3',L('معايرة الطلمبات','Calibrate pumps'),r(x.Qi*1000/60,0)+' / '+x.Qb+' mL/min','☐'],['4',L('بعد أسبوع: موصلية البرج ÷ التعويض','After a week: tower ÷ makeup µS'),'≈ '+x.coc,'☐']]));
  return {h:h,w:w,sum:['E '+r(b.E,2)+' / B '+r(b.Bt,2)+' / M '+r(b.M,2)+' m³/h','Bleed SP '+SP+' / DB +'+DB+' / TL '+hm(tlH*60),'Inhibitor '+r(LDay,1)+' L/day ('+r(mlPerM3,0)+' mL per m³ makeup)','Biocide '+r(bL,1)+' L = '+hhmm(bMin)+' @ '+x.bt]};
}
function towerNone(x){
  var w=[],b=towerBalance(x);if(x.coc<=1)w.push(['bad',t('w9')]);
  var open=b.Bb/x.valve,minH=open*60,LDay=b.Bt*24*x.ppm/1000/x.iRho,pMinDay=x.Qi>0?LDay/x.Qi*60:0,bL=x.Vt*x.bDose/1000/x.bRho,bMin=bL*1000/x.Qb;
  if(open>0.5)w.push(['warn',t('w10',{p:Math.round(open*100)})]);
  kpi([[r(b.E,2)+' m³/h',t('k5')],[r(b.Bt,2)+' m³/h',t('k6')],[r(minH,1)+' min/h',L('فتح المحبس','valve open')],[r(pMinDay,0)+' min/'+L('يوم','day'),L('طلمبة المانع','inhibitor pump')]]);
  var h=sec('gNt1',tbl(['thItem','thVal','thNote',''],[[L('تبخر','Evaporation'),r(b.E,2)+' m³/h','Q × ΔT × 0.00153',''],[L('تصريف','Blowdown'),r(b.Bt,2)+' m³/h','E ÷ (COC − 1)',''],[L('تعويض','Makeup'),r(b.M,2)+' m³/h','','']]));
  h+=sec('gNt2',tbl(['thItem','thVal','thNote',''],[[L('افتح المحبس','Open the valve'),r(minH,1)+' '+L('دقيقة كل ساعة','min each hour'),r(b.Bb,2)+' ÷ '+x.valve+' m³/h',''],[L('أو','or'),r(open*24,1)+' '+L('ساعة في اليوم مقسمة','h/day split'),'','']]));
  h+=sec('gNt3',tbl(['thItem','thVal','thNote',''],[[L('المانع في اليوم','Inhibitor per day'),r(LDay,1)+' L',x.ppm+' mg/L × B',''],[L('تشغيل الطلمبة','Pump run'),r(pMinDay,0)+' '+L('دقيقة في اليوم','min/day'),L('≈ ','≈ ')+r(pMinDay/24,1)+' '+L('دقيقة كل ساعة','min each hour'),'']]));
  h+=sec('gNt4',tbl(['thItem','thVal','thNote',''],[[L('الجرعة','Shot'),r(bL,1)+' L = '+hhmm(bMin),TL.esc(dayName(x.day))+' @ '+x.bt,''],[L('قفل التصريف بعدها','Bleed off after it'),L('ساعتين','2 h'),'','']]));
  h+=sec('gNt5',tbl(['thStep','thItem','thExp',''],[['1',L('موصلية البرج ÷ موصلية التعويض','Tower µS ÷ makeup µS'),'≈ '+x.coc,'☐'],['2',L('لو أعلى: زوّد دقايق المحبس بنفس النسبة','If higher: raise valve minutes by the same ratio'),'','☐'],['3',L('اختبار المانع بكيت المورّد','Inhibitor test with supplier kit'),x.ppm+' mg/L','☐']]),t('towNote'));
  return {h:h,w:w,sum:['Blowdown valve '+r(minH,1)+' min/h','Inhibitor pump '+r(pMinDay,0)+' min/day','Biocide '+r(bL,1)+' L every '+x.wk+' wk']};
}
function dayName(d){var i=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].indexOf(d);return t('d'+(i+1));}

function render(){
  document.querySelectorAll('[data-sys]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-sys')===mode.sys);});
  document.querySelectorAll('[data-ctl]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-ctl')===mode.ctl);});
  var closed=mode.sys==='closed',sens=mode.ctl==='sens';
  $('gClosed').hidden=!closed;$('gTower').hidden=closed;$('SiL').hidden=!closed;$('kgL').hidden=!closed;$('tlfL').hidden=!(closed&&sens);$('rhoL').hidden=closed;$('hw').hidden=!sens;$('chgL').hidden=!closed;
  if(!closed&&$('pLo').value==='8.5'){$('pLo').value='7.0';$('pHi').value='9.0';}
  if(closed&&$('pLo').value==='7.0'&&$('pHi').value==='9.0'){$('pLo').value='8.5';$('pHi').value='10.0';}
  var x={};F.forEach(function(f){var e=$(f);x[f]=e.type==='checkbox'?e.checked:(e.type==='number'?n(f):e.value);});x.wk=+x.wk;
  var res=closed?(sens?closedSens(x):closedNone(x)):(sens?towerSens(x):towerNone(x));
  TL.msg($('warn'),res.w.length?res.w:[['ok',t('noWarn')]]);$('outBody').innerHTML=res.h;
  var om=[['om1',t('omC1')],['om2',sens?t('omC2'):t('omN2')],['om3',t('omC3')],['om4',t('omC4')],['om5',t('omC5')]];
  $('omRows').innerHTML=om.map(function(o){return '<tr><td><b>'+TL.esc(t(o[0]))+'</b></td><td>'+TL.esc(o[1])+'</td></tr>';}).join('');
  $('summary').value=['*TrueLoop · '+(closed?'CHW closed loop':'Cooling tower')+' · '+(sens?'sensors':'timers')+'* '+$('site').value].concat(res.sum).concat(['',URL_APP]).join('\n');
  $('repLine').textContent=t('repLine',{s:$('site').value||'—',d:new Date().toLocaleDateString(TL.lang==='ar'?'ar-EG':'en-GB')});
  st.save(mode);
}
TL.init({root:'../../',dict:D,title:'title',ver:VER,id:'chw',onLang:render});
var m=st.load();if(m&&m.sys)mode=m;
F.forEach(function(f){var e=$(f);e.addEventListener(e.type==='checkbox'||e.tagName==='SELECT'?'change':'input',render);});
document.querySelectorAll('[data-sys]').forEach(function(b){b.onclick=function(){mode.sys=b.getAttribute('data-sys');render();};});
document.querySelectorAll('[data-ctl]').forEach(function(b){b.onclick=function(){mode.ctl=b.getAttribute('data-ctl');render();};});
$('copyBtn').onclick=function(){TL.copy($('summary').value,null,$('summary'));};
$('linkBtn').onclick=function(){TL.copy(URL_APP,TL.t('linkCopied'));};
$('printBtn').onclick=function(){window.print();};
$('resetBtn').onclick=function(){var b=this;if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=TL.t('resetConfirm');setTimeout(function(){b.dataset.armed='';b.textContent=TL.t('reset');},3000);return;}st.clear();location.reload();};
$('appLink').textContent=URL_APP;$('verTxt').textContent='v'+VER;
TL.applyLang();
})();
</script>

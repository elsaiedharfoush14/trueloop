<style>
/* Layout: TrueLoop tool. Navy app bar; desktop = sticky input column + results column; phone = one column + bottom nav. */
:root {
  --bg: #eef3f6;
  --card: #ffffff;
  --soft: #f5f9fb;
  --ink: #071b2b;
  --muted: #566a77;
  --line: #d3dde3;
  --water: #1268d3;
  --aqua: #16b9e0;
  --green: #1db57a;
  --amp: #e79a00;
  --bad: #c2410c;
  --water-soft: #e3effc;
  --amp-soft: #fdf1dc;
  --bad-soft: #fbe7dd;
  --green-soft: #dff5ec;
  --diff: #fff4d6;
  --bar: #071b2b;
  --bar-ink: #ffffff;
  --f-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-en: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", Tahoma, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
  --barh: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06131d; --card: #0c2333; --soft: #0a1c29; --ink: #e3eef4; --muted: #9bb2c0; --line: #1e3d50;
    --water: #5aa2f0; --aqua: #3fcbe9; --green: #3fd194; --amp: #ffb21e; --bad: #fb923c;
    --water-soft: #0f2f4d; --amp-soft: #33270b; --bad-soft: #3a1d10; --green-soft: #0d3326; --diff: #33290f;
    --bar: #030c13; --bar-ink: #e3eef4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #06131d; --card: #0c2333; --soft: #0a1c29; --ink: #e3eef4; --muted: #9bb2c0; --line: #1e3d50;
  --water: #5aa2f0; --aqua: #3fcbe9; --green: #3fd194; --amp: #ffb21e; --bad: #fb923c;
  --water-soft: #0f2f4d; --amp-soft: #33270b; --bad-soft: #3a1d10; --green-soft: #0d3326; --diff: #33290f;
  --bar: #030c13; --bar-ink: #e3eef4; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ar); font-size: 15px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
html[lang="en"] body { font-family: var(--f-en); }
.mono, .p, .chip, .num { font-family: var(--f-mono); direction: ltr; unicode-bidi: isolate; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 1.12rem; font-weight: 600; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--water); }
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }

/* App bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bar); z-index: 30; }
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.appbar .in { max-width: 1320px; margin: 0 auto; min-height: var(--barh); display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; direction: ltr; flex: none; }
.brand svg { width: 30px; height: 32px; }
.brand .wm { font-family: "Readex Pro", sans-serif; font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; }
.brand .wm .lt { font-weight: 300; }
.appbar .sep { width: 1px; height: 26px; background: rgba(255,255,255,.22); flex: none; }
.appbar .ttl { display: grid; min-width: 0; flex: 1; }
.appbar .ttl b { font-family: var(--f-display); font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .ttl span { font-size: .78rem; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang {
  flex: none; border: 1px solid rgba(255,255,255,.35); background: transparent; color: var(--bar-ink);
  border-radius: 99px; padding: 6px 14px; font-weight: 600; font-size: .86rem; cursor: pointer; min-height: 36px;
}
.lang:hover { background: rgba(255,255,255,.08); }
@media (max-width: 560px) { .appbar .sep, .brand .wm { display: none; } }

/* Layout */
.layout {
  max-width: 1320px; margin: 0 auto; display: grid; gap: 20px; align-items: start;
  grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 96px;
}
@media (min-width: 1040px) {
  .layout { grid-template-columns: 390px minmax(0, 1fr); padding-bottom: 40px; }
  .side { position: sticky; top: calc(var(--barh) + env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - var(--barh) - 32px); overflow: auto; }
}
.content { display: grid; gap: 20px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; scroll-margin-top: calc(var(--barh) + 16px); }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }

/* Inputs */
.side { display: grid; gap: 0; padding: 0; overflow: hidden; }
.side .side-h { padding: 16px 18px 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.side .side-h .small { color: var(--muted); }
details.grp { border-top: 1px solid var(--line); }
details.grp:first-of-type { border-top: 0; }
details.grp > summary {
  list-style: none; cursor: pointer; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-family: var(--f-display); font-weight: 600; font-size: .95rem;
}
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::after { content: ""; width: 9px; height: 9px; border-inline-end: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-top: -4px; transition: transform .15s; flex: none; }
details.grp[open] > summary::after { transform: rotate(225deg); margin-top: 4px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 14px; padding: 2px 18px 18px; }
.field { display: grid; gap: 5px; align-content: start; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label { font-size: .8rem; color: var(--muted); font-weight: 500; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.field > label .p { color: var(--water); font-size: .74rem; font-weight: 600; }
input[type=number], select {
  font-size: 15px; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; width: 100%; min-height: 42px;
}
input[type=number] { font-family: var(--f-mono); direction: ltr; text-align: start; }
html[dir="rtl"] input[type=number] { text-align: right; }
input:disabled { opacity: .45; }
.big select { font-size: 1.15rem; font-weight: 700; background: var(--water-soft); border-color: var(--water); color: var(--ink); }
.check { display: flex; gap: 8px; align-items: center; min-height: 34px; font-size: .9rem; }
.check input { width: 18px; height: 18px; accent-color: var(--water); flex: none; }

/* Summary tiles */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.tile .k { font-size: .78rem; color: var(--muted); font-weight: 500; }
.tile .v { font-family: var(--f-display); font-weight: 600; font-size: 1.55rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .v .u { font-size: .85rem; font-weight: 500; color: var(--muted); margin-inline-start: 4px; }
.tile .s { font-size: .8rem; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 99px; width: fit-content; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.warn { background: var(--amp-soft); color: var(--amp); }
.pill.crit { background: var(--bad-soft); color: var(--bad); }

/* Alerts */
.alerts { display: grid; gap: 8px; }
.alert { border-radius: 10px; padding: 10px 14px; font-size: .9rem; display: flex; gap: 10px; align-items: flex-start; border: 1px solid; background: var(--card); }
.alert .tag { font-size: .7rem; font-weight: 700; letter-spacing: .04em; padding: 2px 9px; border-radius: 99px; white-space: nowrap; margin-top: 2px; color: #fff; }
.alert.crit { border-color: var(--bad); background: var(--bad-soft); }
.alert.crit .tag { background: var(--bad); }
.alert.warn { border-color: var(--amp); background: var(--amp-soft); }
.alert.warn .tag { background: var(--amp); color: #1b1200; }
.alert.ok { border-color: var(--green); background: var(--green-soft); }
.alert.ok .tag { background: var(--green); }

/* Sequence */
.seq-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .seq-grid { grid-template-columns: minmax(0, 1fr); } }
.seq { list-style: none; margin: 0; padding: 0; display: grid; counter-reset: step; }
.seq li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 16px; }
.seq li::before {
  counter-increment: step; content: counter(step); font-family: var(--f-mono); font-weight: 600; font-size: .8rem;
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--water); color: #fff;
}
.seq li::after { content: ""; position: absolute; inset-inline-start: 15px; top: 32px; bottom: 0; width: 2px; background: var(--line); }
.seq li:last-child::after { display: none; }
.seq li.off::before { background: var(--line); color: var(--muted); }
.seq .body { display: grid; gap: 3px; min-width: 0; padding-top: 3px; }
.seq .when { font-size: .9rem; }
.seq .then { font-size: .86rem; color: var(--muted); }
.chip { display: inline-block; font-size: .74rem; font-weight: 600; color: var(--water); background: var(--water-soft); border-radius: 5px; padding: 0 6px; margin-inline: 2px; }
.num { font-weight: 600; color: var(--ink); }
.side-col { display: grid; gap: 16px; min-width: 0; }
.ladder-wrap { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; display: grid; gap: 6px; }
.ladder-wrap svg { width: 100%; height: auto; display: block; }
.tank { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; background: var(--card); }
.tank .big-num { font-family: var(--f-display); font-size: 2rem; font-weight: 600; color: var(--water); direction: ltr; unicode-bidi: isolate; width: fit-content; }
.tank p, .tank li { font-size: .86rem; color: var(--muted); }
.tank ol { margin: 0; padding-inline-start: 20px; display: grid; gap: 3px; }

/* Wiring chain */
.chain-scroll { overflow-x: auto; padding-bottom: 4px; }
.chain { display: flex; align-items: stretch; min-width: min-content; }
.node { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 128px; display: grid; gap: 3px; font-size: .82rem; }
.node b { font-family: var(--f-display); font-size: .92rem; }
.node .row { display: flex; justify-content: space-between; gap: 10px; }
.node .on { color: var(--green); font-weight: 600; }
.node .off { color: var(--muted); }
.link { width: 26px; align-self: center; height: 2px; background: var(--aqua); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .82rem; color: var(--muted); }
.wire-note { font-size: .9rem; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }

/* Drives */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 7px 15px; font-weight: 600; font-size: .88rem; cursor: pointer; min-height: 38px; }
.tab[aria-selected="true"] { background: var(--water); border-color: var(--water); color: #fff; }
.lcdbar { font-family: var(--f-mono); direction: ltr; background: var(--bar); color: #9fe8f6; border-radius: 6px; padding: 5px 12px; font-size: .8rem; letter-spacing: .02em; }
.btn { border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--water); background: var(--water); color: #fff; font-weight: 600; font-size: .88rem; min-height: 40px; }
.btn:hover { filter: brightness(1.06); }
.copied { font-size: .84rem; color: var(--green); font-weight: 600; }
.diffkey { display: inline-block; width: 14px; height: 14px; border-radius: 3px; background: var(--diff); border: 1px solid var(--amp); vertical-align: -2px; margin-inline-end: 6px; }
.table-scroll { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: start; font-size: .74rem; color: var(--muted); font-weight: 600; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.grp td { background: var(--soft); font-family: var(--f-display); font-weight: 600; font-size: .86rem; padding-block: 7px; }
td.par { font-family: var(--f-mono); direction: ltr; white-space: nowrap; color: var(--water); font-weight: 600; }
html[dir="rtl"] td.par, html[dir="rtl"] td.name { text-align: right; }
td.name { font-family: var(--f-mono); direction: ltr; font-size: .8rem; color: var(--muted); }
td.val { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
td.note { color: var(--muted); font-size: .84rem; min-width: 160px; }
tr.diff td { background: var(--diff); }
@media (max-width: 720px) {
  thead { display: none; }
  table, tbody { display: block; }
  tr { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  tr.grp { padding: 0; border: 0; }
  tr.grp td { display: block; border-radius: 6px; margin-top: 8px; }
  td { border: 0; padding: 0; }
  tr.grp td { grid-column: 1 / -1; padding: 6px 10px; }
  td.par { grid-row: 1; }
  td.val { grid-row: 1; text-align: end; white-space: normal; }
  td.name { grid-column: 1 / -1; grid-row: 2; }
  td.note { grid-column: 1 / -1; grid-row: 3; min-width: 0; }
  tr.diff { background: var(--diff); border-radius: 8px; padding-inline: 8px; }
  tr.diff td { background: transparent; }
}
textarea.copy-area { width: 100%; min-height: 160px; font-family: var(--f-mono); direction: ltr; background: var(--soft); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }

/* Checks */
.checks { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: minmax(84px, auto) 1fr; gap: 12px; align-items: baseline; font-size: .9rem; }
.checks .k { font-family: var(--f-mono); direction: ltr; color: var(--water); font-weight: 600; white-space: nowrap; font-size: .82rem; }

/* Contact strip */
.cta { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; background: var(--bar); color: #fff; border-radius: var(--r); padding: 18px; }
.cta svg.mk { width: 48px; height: 50px; }
.cta b { font-family: var(--f-display); font-size: 1.05rem; }
.cta p { font-size: .88rem; opacity: .88; }
.cta a.wa { display: inline-flex; align-items: center; gap: 8px; background: var(--green); color: #04120c; text-decoration: none; font-weight: 700; border-radius: 99px; padding: 9px 16px; white-space: nowrap; direction: ltr; }
@media (max-width: 640px) { .cta { grid-template-columns: auto 1fr; } .cta a.wa { grid-column: 1 / -1; justify-content: center; } }
.fineprint { font-size: .78rem; color: var(--muted); }

/* Bottom nav (phone / tablet) */
.bottomnav {
  position: fixed; inset: auto 0 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.bottomnav a { display: grid; justify-items: center; gap: 1px; padding: 6px 4px; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 600; border-radius: 10px; }
.bottomnav a svg { width: 22px; height: 22px; }
.bottomnav a.active { color: var(--water); background: var(--water-soft); }
@media (min-width: 1040px) { .bottomnav { display: none; } }
@media (prefers-reduced-motion: no-preference) {
  .tab, .btn, .lang, details.grp > summary::after { transition: background .15s, color .15s, transform .15s; }
  html { scroll-behavior: smooth; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gDrop" x1="25" y1="85" x2="72" y2="30" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1268d3"/><stop offset=".5" stop-color="#16b9e0"/><stop offset=".78" stop-color="#16b9e0"/><stop offset="1" stop-color="#ffb21e"/></linearGradient>
  <linearGradient id="gBolt" x1="66" y1="2" x2="66" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe066"/><stop offset=".55" stop-color="#ffb21e"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
  <symbol id="mark" viewBox="0 -4 100 104">

<header class="appbar">
  <div class="in">
    <a class="brand" href="../../" aria-label="TrueLoop home">
      <svg role="img" aria-label="TrueLoop logo"><use href="#mark"/></svg>
      <span class="wm"><span class="lt">True</span>Loop</span>
    </a>
    <span class="sep" aria-hidden="true"></span>
    <div class="ttl">
      <b data-ar="حاسبة برمجة IPC لإنفرترات ACH480" data-en="ACH480 IPC Setup Calculator"></b>
      <span data-ar="بوستر من 2 لـ 8 طرمبات · مانوال وأوتو" data-en="2 to 8 booster pumps · manual and auto"></span>
    </div>
    <button type="button" class="lang" id="langBtn" aria-label="Language"></button>
  </div>
</header>

<main class="layout">
  <aside class="card side" id="s-inputs" aria-labelledby="in-h">
    <div class="side-h">
      <h2 id="in-h" data-ar="بيانات الموقع" data-en="Site data"></h2>
      <span class="small" data-ar="بتتحفظ على جهازك" data-en="Saved on this device"></span>
    </div>
    <form id="f" autocomplete="off">
      <details class="grp" open>
        <summary data-ar="الطرمبات والسرعات" data-en="Pumps and speeds"></summary>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ids = ['n','motorHz','minHz','maxHz','setpoint','range','sensorType','sensorWiring','startHz','stopHz','manualMethod','manualHz','permissive',
             'sleepHz','wakeP','sleep','standby','accel','decel','stopMode','startDelay','stopDelay','smooth','fillT','fill','sleepDelay','wakeDelay','boostP','boostT','boost','tank','runRO','faultRO','faultLogic'];
  var KEY = 'ipc-setup-cfg-v1', LKEY = 'ipc-lang';
  var active = 1;
  var lang = 'ar';
  function T(ar, en) { return lang === 'ar' ? ar : en; }

  // ---------- language ----------
  function pickLang() {
    var q = (location.search.match(/[?&]lang=(ar|en)/) || [])[1];
    if (q) return q;
    try { var s = localStorage.getItem(LKEY) || localStorage.getItem('tl_lang'); if (s === 'ar' || s === 'en') return s; } catch (e) {}
    return 'ar';
  }
  function applyLang() {
    var h = document.documentElement;
    h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-ar]').forEach(function (el) { el.textContent = el.getAttribute(lang === 'ar' ? 'data-ar' : 'data-en'); });
    $('langBtn').textContent = lang === 'ar' ? 'English' : 'عربي';
    $('langBtn').setAttribute('lang', lang === 'ar' ? 'en' : 'ar');
    document.title = T('حاسبة IPC · TrueLoop', 'IPC Calculator · TrueLoop');
  }

  // ---------- storage ----------
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!s) return;
      ids.forEach(function (k) {
        if (!(k in s)) return;
        var el = $(k); if (!el) return;
        if (el.type === 'checkbox') el.checked = !!s[k]; else el.value = s[k];
        if (el.tagName === 'SELECT' && el.selectedIndex < 0) el.selectedIndex = 0;
      });
    } catch (e) {}
  }
  function save() {
    try {
      var o = {};
      ids.forEach(function (k) { var el = $(k); o[k] = el.type === 'checkbox' ? el.checked : el.value; });
      localStorage.setItem(KEY, JSON.stringify(o));
    } catch (e) {}
  }

  // ---------- model ----------
  function num(id) { var v = parseFloat($(id).value); return isFinite(v) ? v : 0; }
  function cfg() {
    var c = {
      n: parseInt($('n').value, 10), motorHz: num('motorHz'), minHz: num('minHz'), maxHz: num('maxHz'),
      setpoint: num('setpoint'), range: num('range'), sensorType: $('sensorType').value, sensorWiring: $('sensorWiring').value,
      startHz: num('startHz'), stopHz: num('stopHz'), manualMethod: $('manualMethod').value, manualHz: num('manualHz'),
      permissive: $('permissive').value, sleepHz: num('sleepHz'), wakeP: num('wakeP'),
      sleep: $('sleep').checked, standby: $('standby').checked,
      accel: num('accel'), decel: num('decel'), stopMode: $('stopMode').value,
      startDelay: num('startDelay'), stopDelay: num('stopDelay'), smooth: num('smooth'),
      fill: $('fill').checked, fillT: num('fillT'),
      sleepDelay: num('sleepDelay'), wakeDelay: num('wakeDelay'),
      boost: $('boost').checked, boostP: num('boostP'), boostT: num('boostT'), tank: $('tank').checked,
      runRO: parseInt($('runRO').value, 10), faultRO: parseInt($('faultRO').value, 10), faultLogic: $('faultLogic').value
    };
    c.wakeDev = c.setpoint - c.wakeP;
    c.boostOn = c.sleep && c.boost && c.boostP > 0;
    c.top = c.setpoint + (c.boostOn ? c.boostP : 0);
    c.precharge = Math.floor(c.wakeP * 0.9 * 10 + 1e-9) / 10;
    c.maxRun = c.standby ? c.n - 1 : c.n;
    return c;
  }
  function hz(v) { return (+v).toFixed(2) + ' Hz'; }
  function f2(v) { return (+v).toFixed(2); }
  function f1(v) { return (+v).toFixed(1); }
  function s(v) { return (+v).toFixed(v % 1 ? 1 : 0); }
  function drv(i) { return T('إنفرتر ' + i, 'Drive ' + i); }

  function warnings(c) {
    var w = [];
    if (c.n > 8) return [{ lvl: 'crit', t: T('نظام IPC في ACH480 آخره 8 طرمبات (Master واحد + 7 Followers)، والـ Node number في 76.22 من 1 لـ 8 بس. لـ ' + c.n + ' طرمبات محتاج PLC يعمل الـ Cascade، أو تقسيم المحطة لمجموعتين لو كل مجموعة ليها هيدر منفصل.',
      'ACH480 IPC supports up to 8 pumps (one master and 7 followers); node numbers in 76.22 go from 1 to 8. For ' + c.n + ' pumps you need a PLC cascade, or two groups if each group has its own header.') }];
    if (c.minHz >= c.stopHz) w.push({ lvl: 'crit', t: T('أقل سرعة (30.13 = ' + c.minHz + ' Hz) لازم تبقى أقل من الـ Stop point (' + c.stopHz + ' Hz)، وإلا 76.02 هيطلع Not ready (level conflict).',
      'Minimum frequency (30.13 = ' + c.minHz + ' Hz) must be below the stop point (' + c.stopHz + ' Hz), otherwise 76.02 shows Not ready (level conflict).') });
    if (c.stopHz >= c.startHz) w.push({ lvl: 'crit', t: T('الـ Stop point لازم يبقى أقل من الـ Start point.', 'The stop point must be below the start point.') });
    else if (c.startHz - c.stopHz < 5) w.push({ lvl: 'warn', t: T('الفرق بين الدخول والخروج ' + f2(c.startHz - c.stopHz) + ' Hz بس. الطرمبات ممكن تفضل تدخل وتخرج، فجرّب في الموقع.',

  function renderLadder(c) {
    var pts = [];
    pts.push({ p: c.setpoint, l: T('Setpoint · السويتش يفصل', 'Setpoint · switch cut-out'), col: 'var(--water)', w: 2.2 });
    if (c.sleep && c.boostOn) pts.push({ p: c.top, l: T('Boost · قبل النوم', 'Boost · before sleep'), col: 'var(--green)', w: 1.4 });
    if (c.wakeP > 0) pts.push({ p: c.wakeP, l: (c.sleep ? T('الصحيان · ', 'Wake-up · ') : '') + T('السويتش يوصل', 'switch cut-in'), col: 'var(--amp)', w: 1.6 });
    if (c.tank && c.precharge > 0) pts.push({ p: c.precharge, l: T('ضغط البالونة', 'Tank pre-charge'), col: 'var(--aqua)', w: 1.6 });
    var vals = pts.map(function (x) { return x.p; });
    var lo = Math.max(0, Math.floor(Math.min.apply(null, vals) - 0.5));
    var hi = Math.min(c.range > 0 ? c.range : 100, Math.ceil(Math.max.apply(null, vals) + 0.5));
    if (hi <= lo) hi = lo + 1;
    var W = 340, H = 250, y0 = 14, y1 = H - 22, xL = 38, xR = 92, rtl = lang === 'ar';
    var Y = function (p) { return y1 - (p - lo) / (hi - lo) * (y1 - y0); };
    pts.sort(function (a, b) { return b.p - a.p; });
    var ly = pts.map(function (x) { return Y(x.p); });
    for (var i = 1; i < ly.length; i++) if (ly[i] - ly[i - 1] < 22) ly[i] = ly[i - 1] + 22;
    var g = [];
    g.push('<line x1="' + xL + '" x2="' + xL + '" y1="' + y0 + '" y2="' + y1 + '" style="stroke:var(--muted)" stroke-width="1"/>');
    var step = (hi - lo) > 4 ? 1 : 0.5;
    for (var t = lo; t <= hi + 1e-9; t += step) {
      var yy = Y(t);
      g.push('<line x1="' + (xL - 4) + '" x2="' + xL + '" y1="' + yy + '" y2="' + yy + '" style="stroke:var(--muted)"/>');
      g.push('<text x="' + (xL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" direction="ltr" font-size="12" style="fill:var(--muted);font-family:var(--f-mono)">' + (+t).toFixed(1) + '</text>');
    }
    if (c.sleep && c.wakeP < c.top) g.push('<rect x="' + (xL + 1) + '" y="' + Y(c.top) + '" width="' + (xR - xL - 1) + '" height="' + (Y(c.wakeP) - Y(c.top)) + '" style="fill:var(--water-soft)"/>');
    pts.forEach(function (x, k) {
      var yv = Y(x.p), yl = ly[k];
      g.push('<line x1="' + xL + '" x2="' + xR + '" y1="' + yv + '" y2="' + yv + '" style="stroke:' + x.col + '" stroke-width="' + x.w + '"/>');
      g.push('<path d="M' + xR + ' ' + yv + ' L' + (xR + 10) + ' ' + yl + '" fill="none" style="stroke:' + x.col + '" stroke-width="1"/>');
      g.push('<text x="' + (xR + 12) + '" y="' + (yl + 4) + '" text-anchor="start" direction="ltr" font-size="14" font-weight="600" style="fill:' + x.col + ';font-family:var(--f-mono)">' + f2(x.p) + '</text>');
      g.push('<text x="' + (W - 6) + '" y="' + (yl + 4) + '" text-anchor="' + (rtl ? 'start' : 'end') + '" direction="' + (rtl ? 'rtl' : 'ltr') + '" font-size="13.5" style="fill:var(--ink);font-family:' + (rtl ? 'var(--f-ar)' : 'var(--f-en)') + '">' + esc(x.l) + '</text>');
    });
    g.push('<text x="' + xL + '" y="' + (H - 4) + '" text-anchor="middle" font-size="11" style="fill:var(--muted)">bar</text>');
    $('ladder').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(T('مستويات الضغط', 'Pressure levels')) + '">' + g.join('') + '</svg>' +
      (c.sleep ? '<p class="small muted">' + T('المنطقة الملوّنة هي اللي الطرمبة بتنام فيها والبالونة بتغذي السحب.', 'Shaded band: the pump sleeps and the tank supplies demand.') + '</p>' : '');
  }

    $('lcd').textContent = 'Auto  ACH480  ·  Node ' + active + ' / ' + c.n + '  ·  ' + master;
  }

  function copyText(c) {
    var lines = [T('إنفرتر ' + active + ' من ' + c.n + ' — إعدادات IPC', 'Drive ' + active + ' of ' + c.n + ' — IPC settings'), 'TrueLoop IPC Calculator'];
    driveGroups(c, active).forEach(function (g) {
      lines.push('');
      lines.push('[' + g.t + ']');
      g.r.forEach(function (r) { lines.push(r[0] + '  ' + r[1] + ' = ' + r[2] + (r[3] ? '   (' + r[3] + ')' : '')); });
    });
    if (c.tank) { lines.push(''); lines.push(T('ضغط البالونة (Pre-charge) = ', 'Tank pre-charge = ') + f1(c.precharge) + ' bar'); }
    return lines.join('\n');
  }

  function renderChecks(c) {
    var bits = '';
    for (var b = 8; b >= 1; b--) { bits += (b <= c.n ? '1' : '0'); if (b === 5) bits += ' '; }
    var items = [
      ['10.02', T('على الأوتو Bit 4 (DI5) = 1 وBit 0 (DI1) = 0، وعلى المانوال العكس.', 'On auto, bit 4 (DI5) = 1 and bit 0 (DI1) = 0; on manual the opposite.')],
      ['12.21', c.sensorWiring === 'one' ? T('الـ mA على إنفرتر 1 منطقية مع الضغط.', 'mA on drive 1 matches the pressure.') : T('نفس الـ mA تقريباً على كل الإنفرترات، والفرق أقل من 0.1 mA. لو واحد بيقرا أقل، فيه تيار بيهرب من سكة تانية.', 'Same mA on every drive, within 0.1 mA. A lower reading means current is leaking through another path.')],
      ['12.22 / 40.02', T('قريبين من المانومتر على كل إنفرتر عليه حساس.', 'Close to the pressure gauge on every drive with a sensor.')],
      ['77.20', T('على كل إنفرتر = ' + bits + '، يعني الـ ' + c.n + ' إنفرترات شايفين بعض.', 'On every drive = ' + bits + ': all ' + c.n + ' drives see each other.')],
      ['76.105', T('نفس الرقم على كل الإنفرترات، يعني الإعدادات متزامنة.', 'Same value on every drive: settings are synchronized.')],
      ['76.02', T('في الأوتو: إنفرتر واحد Master والباقي Follower أو Standby. في المانوال: Not ready (Hand mode (EXT1))، وده طبيعي.', 'On auto: one drive Master, the rest Follower or Standby. On manual: Not ready (Hand mode (EXT1)), which is normal.')],
      ['Sleep', c.sleep ? T('اقفل الاستهلاك واقرا السرعة وهي ماسكة ' + f2(c.setpoint) + ' bar. لازم 40.43 يبقى أعلى منها بـ 1–2 Hz، وبعد ' + s(c.sleepDelay) + ' s لازم 76.02 يكتب Master (PID sleep).',
        'Close all demand and read the speed at ' + f2(c.setpoint) + ' bar. 40.43 must be 1–2 Hz above it, and after ' + s(c.sleepDelay) + ' s 76.02 must show Master (PID sleep).') : T('الـ Sleep مقفول.', 'Sleep is off.')],
      [T('البالونة', 'Tank'), c.tank ? T('Pre-charge = ' + f1(c.precharge) + ' bar والطرمبات واقفة والبالونة فاضية.', 'Pre-charge = ' + f1(c.precharge) + ' bar with pumps stopped and the tank drained.') : T('مفيش بالونة.', 'No tank.')],
      ['10.21', T('الـ Bit بتاع RO' + c.runRO + ' يبقى 1 لما الطرمبة تشتغل', 'The RO' + c.runRO + ' bit is 1 when the pump runs') + (c.faultLogic === 'Fault (-1)' ? T('، والـ Bit بتاع RO' + c.faultRO + ' يبقى 1 طول ما مفيش عطل.', ', and the RO' + c.faultRO + ' bit stays 1 while there is no fault.') : '.')],
      ['Failover', T('اعمل Off للـ Master، ولازم إنفرتر تاني يبقى Master والضغط ما يقعش.', 'Switch the master Off: another drive must become master without a pressure drop.')]
    ];
    $('checks').innerHTML = items.map(function (it) { return '<li><span class="k">' + esc(it[0]) + '</span><span>' + esc(it[1]) + '</span></li>'; }).join('');
  }

  function syncDisabled() {
    var sl = $('sleep').checked;
    ['sleepHz', 'sleepDelay', 'wakeDelay', 'boost'].forEach(function (k) { $(k).disabled = !sl; });
    var bo = sl && $('boost').checked;
    ['boostP', 'boostT'].forEach(function (k) { $(k).disabled = !bo; });
    $('fillT').disabled = !$('fill').checked;
  }

  function render() {
    syncDisabled();
    var c = cfg();
    save();
    var w = warnings(c);
    renderSummary(c, w);
    renderAlerts(w);
    var unsupported = c.n > 8;
    ['s-seq', 's-wiring', 's-drives', 's-checks'].forEach(function (id) { $(id).hidden = unsupported; });
    if (unsupported) return;
    if (active > c.n) active = 1;
    renderSeq(c); renderLadder(c); renderTank(c);
    renderChain(c); renderTabs(c); renderTable(c); renderChecks(c);
    $('copyArea').hidden = true; $('copied').hidden = true;
  }

  // ---------- events ----------
  $('f').addEventListener('input', render);
  $('f').addEventListener('change', render);
  $('f').addEventListener('submit', function (e) { e.preventDefault(); });
  $('tabs').addEventListener('click', function (e) {
    var t = e.target.closest('.tab'); if (!t) return;
    active = parseInt(t.getAttribute('data-i'), 10);
    var c = cfg(); renderTabs(c); renderTable(c);
    $('copyArea').hidden = true; $('copied').hidden = true;
    var nt = $('tab' + active); if (nt) nt.focus();
  });
  $('copyBtn').addEventListener('click', function () {
    var txt = copyText(cfg());
    var fallback = function () { var a = $('copyArea'); a.value = txt; a.hidden = false; a.focus(); a.select(); };
    try {
      navigator.clipboard.writeText(txt).then(function () { $('copied').hidden = false; $('copyArea').hidden = true; }, fallback);
    } catch (e) { fallback(); }
  });
  $('langBtn').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem(LKEY, lang); localStorage.setItem('tl_lang', lang); } catch (e) {}
    applyLang(); render();
  });

  // bottom nav: highlight the section in view
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('.bottomnav a'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        navLinks.forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-sec') === en.target.id); });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    ['s-inputs', 's-seq', 's-drives', 's-checks'].forEach(function (id) { var el = $(id); if (el) io.observe(el); });
  }

  lang = pickLang();
  applyLang();
  load();
  render();

  // Opened from the TrueLoop Field app: the logo goes back to the app, and the tool shows under "recent".
  try {
    var inApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true || sessionStorage.getItem('tl_app') === '1' || /[?&]app=1/.test(location.search);
    if (inApp) { sessionStorage.setItem('tl_app', '1'); var br = document.querySelector('.appbar .brand'); if (br) br.href = '../../app/'; }
    var rec = JSON.parse(localStorage.getItem('tl_recent') || '[]').filter(function (x) { return x !== 'ipc'; }); rec.unshift('ipc'); localStorage.setItem('tl_recent', JSON.stringify(rec.slice(0, 6)));
  } catch (e) {}

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
